name: Validate Sector Discovery

on:
  pull_request:
    paths:
      - "scripts/build_sector_discovery.py"
      - "scripts/discovery_coverage.py"
      - "scripts/build_theme_evidence.py"
      - "scripts/price_inputs.py"
      - "scripts/build_history.py"
      - "tests/test_theme_evidence.py"
      - "research/theme_industry_catalog.json"
      - "scripts/validate_theme_handoff_routes.py"
      - "tests/test_sector_discovery.py"
      - "tests/test_theme_handoff_routes.py"
      - "skill/TREND_REGISTRY_PROTOCOL.md"
      - ".github/workflows/validate-sector-discovery.yml"
      - ".github/workflows/update-data.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/validate_theme_handoff_routes.py"
      - "tests/test_theme_handoff_routes.py"
      - "skill/TREND_HANDOFF_ROUTING_OVERRIDE.md"
      - ".github/workflows/run-trend-buy-formal.yml"
      - ".github/workflows/update-data.yml"
      - "tests/test_daily_data_delivery_workflow.py"
      - "scripts/build_sector_discovery.py"
      - "scripts/discovery_coverage.py"
      - "skill/TREND_REGISTRY_PROTOCOL.md"
      - "scripts/build_theme_evidence.py"
      - "tests/test_sector_discovery.py"
      - "tests/test_theme_evidence.py"
      - ".github/workflows/validate-sector-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit-test discovery and coverage gates
        run: python -m unittest discover -s tests -p 'test_sector_discovery.py' -v
      - name: Test compact auxiliary theme evidence
        run: python -m unittest discover -s tests -p 'test_theme_evidence.py' -v
      - name: Route validation unit tests
        run: python -m unittest discover -s tests -p 'test_theme_handoff_routes.py' -v
      - name: Verify daily persistence, Python checks and fail-closed auxiliary data
        run: python -m unittest discover -s tests -p "test_daily_data_delivery_workflow.py" -v
      - name: Compile discovery and routing preflight
        run: python -m py_compile scripts/discovery_coverage.py scripts/build_sector_discovery.py scripts/build_theme_evidence.py scripts/validate_theme_handoff_routes.py
      - name: Prove sector discovery needs no full-market JSON
        run: |
          rm -f data/research/full_market_price_structure.json
          test ! -e data/research/full_market_price_structure.json
      - name: Smoke-test with frozen real market data
        run: |
          python scripts/build_history.py
          python scripts/build_bridge.py
          python scripts/build_sector_discovery.py --output /tmp/sector_discovery.json --audit /tmp/sector_audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          snapshot=json.loads(Path('/tmp/sector_discovery.json').read_text())
          audit=json.loads(Path('/tmp/sector_audit.json').read_text())
          assert snapshot['trade_date'] == audit['trade_date']
          assert audit['industry_count'] >= 300
          assert len(audit['sectors']) >= 300
          assert audit['selected_count'] <= 3
          assert audit['selected_count'] + audit['deferred_count'] == audit['eligible_count']
          assert snapshot['no_trade_signal'] is True
          assert snapshot['discovery_role']['mode'] == 'AUXILIARY_EVIDENCE_ONLY'
          assert snapshot['discovery_role']['may_set_new_position_priority'] is False
          assert snapshot['discovery_role']['missing_discovery_blocks_primary_research'] is False
          assert snapshot['theme_research_budget']['scope'] == 'supplemental_program_discovery_only'
          assert len(snapshot['candidate_overview']) == audit['eligible_count']
          assert snapshot['theme_research_budget']['max_new_theme_deep_research'] == 3
          assert snapshot['theme_research_budget']['unit'] == 'evidence_verified_theme_not_industry'
          assert len(snapshot['classification_peer_hints']) <= 3
          print('DISCOVERY_REAL_DATA_VALID', json.dumps({
              'date': snapshot['trade_date'], 'status': snapshot['status'],
              'industry_count': audit['industry_count'],
              'concept_coverage_status': audit['concept_coverage_status'],
              'candidate_count': audit['eligible_count']}, ensure_ascii=False))
          for row in audit['sectors']:
              if row['kind'] == 'industry' and any(x in row['name'] for x in ('种子', '粮食种植', '粮油加工')):
                  print('AGRICULTURE_INDUSTRY_AUDIT', json.dumps({
                      'sector': row['name'], 'n': row['member_count'],
                      'median_1d_pct': row['median_1d_pct'],
                      'breadth': row['advance_ratio'], 'relative_strength':
                      row['relative_1d_vs_market_median_pct'],
                      'channels': row['channels'], 'reason': row['reason']},
                      ensure_ascii=False))
          PY
      - name: Verify full 17-theme auxiliary aggregation with frozen market data
        run: |
          python scripts/build_theme_evidence.py \
            --sector-audit /tmp/sector_audit.json \
            --allow-retrospective-smoke \
            --output /tmp/theme_evidence_smoke.json
          python - <<'PY'
          import json
          from pathlib import Path
          t=json.loads(Path('/tmp/theme_evidence_smoke.json').read_text())
          latest=json.loads(Path('data/latest.json').read_text())
          catalog=json.loads(Path('research/theme_industry_catalog.json').read_text())
          historical_replay=catalog['catalog_as_of_date']>latest['trade_date']
          assert t['trade_date']==latest['trade_date']
          assert t['status']==('RETROSPECTIVE_MAPPING_SMOKE' if historical_replay else 'COMPLETE')
          assert t['point_in_time_eligible'] is (not historical_replay)
          assert t['scan_summary']['industry_universe_count']==331
          assert t['scan_summary']['themes_evaluated']==17
          assert t['scan_summary']['taxonomy_groups_evaluated']==131
          assert t['scan_summary']['taxonomy_covered_level3_industries']==331
          assert t['scan_summary']['curated_candidates_returned']+t['scan_summary']['taxonomy_candidates_returned']==len(t['research_candidates'])
          assert all(x['evidence_group_type'] in ('RESEARCH_THEME','SW_L2_TAXONOMY') for x in t['research_candidates'])
          assert len(t['research_candidates'])<=3
          assert 0 <= len(t['crosscheck_shortlist']) <= 3
          assert t['scan_summary']['crosscheck_shortlist_count']==len(t['crosscheck_shortlist'])
          assert all(x['rank']==i+1 for i,x in enumerate(t['crosscheck_shortlist']))
          assert t['no_trade_signal'] and t['auxiliary_only']
          assert t['decision_authority']=='independent_model_research_only'
          assert 'tracked_theme_alerts' not in t
          assert 'registry_baseline_trade_date' not in t['scan_summary']
          assert 'unknown_tracked_themes' not in t['scan_summary']
          assert 'all_theme_metrics' not in t
          assert 'trends' not in t
          print('AUXILIARY_THEME_SMOKE_VALID', json.dumps(t['scan_summary'], ensure_ascii=False))
          PY
      - name: Verify paired trend publication and date-aligned confirmed industry routes
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from validate_trend_publication_pair import validate
          from validate_theme_handoff_routes import check_theme_routes
          read=lambda p:json.loads(Path(p).read_text(encoding='utf-8'))
          r=read('research/trend_registry.json')
          h=read('research/trend_handoff.json')
          idx=read('data/low_risk/index.json')
          errors=validate(r,h)
          if errors:
              raise SystemExit('UPSTREAM_PAIR_INVALID:'+','.join(errors))
          if h['signals'] and idx.get('trade_date') != h.get('trade_date'):
              # Market data is published before the closing industry study.
              # Old handoff remains read-only; never route old sectors with
              # a later daily company index just to make this smoke pass.
              print('ROUTE_SMOKE_DEFERRED_UNTIL_SAME_DAY_DATA_AND_TREND',
                    h['trade_date'], idx.get('trade_date'))
          else:
              print('ROUTE_SMOKE_RESULT',check_theme_routes(h,idx,r)['status'])
          PY
