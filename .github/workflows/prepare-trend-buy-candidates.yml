name: A-share trend-buy frozen candidate admission
on:
  push:
    branches: [main]
    paths:
      - 'research/trend_handoff.json'
      - 'data/low_risk/index.json'
      - 'data/research/core_profit_refresh_latest.json'
      - 'scripts/prepare_trend_buy_candidates.py'
      - 'scripts/freeze_trend_buy_fund_flow.py'
      - 'requirements.txt'
      - 'scripts/trend_buy_prescreen_core.py'
      - 'scripts/build_trend_buy_manual_research.py'
      - '.github/workflows/prepare-trend-buy-candidates.yml'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/freeze_trend_buy_fund_flow.py'
      - 'scripts/prepare_trend_buy_candidates.py'
      - 'scripts/run_model_top1_formal.py'
      - 'tests/test_frozen_trend_buy_fund_flow.py'
      - '.github/workflows/prepare-trend-buy-candidates.yml'

permissions:
  contents: read

concurrency:
  group: trend-buy-candidate-admission-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm current-day closed upstream and working set
        id: admission
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          upstream=json.loads(Path('research/trend_handoff.json').read_text())
          idx=json.loads(Path('data/low_risk/index.json').read_text())
          now=datetime.now(ZoneInfo('Asia/Shanghai')).date().isoformat()
          day=upstream.get('trade_date')
          previous=json.loads(Path('research/trend_buy_formal_result.json').read_text())
          locked=(previous.get('trade_date')==day and isinstance(previous.get('model_top1_selection'),dict))
          allow=(not locked and day==now and idx.get('trade_date')==now
                 and idx.get('validation',{}).get('status')=='passed'
                 and bool(upstream.get('signals')))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('run='+('true' if allow else 'false')+'\n')
          print('PROGRAM_ADMISSION_DAY_STATUS',json.dumps({
              'today':now,'sector_date':day,'index_date':idx.get('trade_date'),
              'sector_signals':len(upstream.get('signals') or []),'same_day_locked':locked,
              'will_run':allow},ensure_ascii=False))
          PY
      - name: Freeze program-only candidates (research starts after this)
        if: steps.admission.outputs.run == 'true'
        run: |
          python scripts/prepare_trend_buy_candidates.py \
            --output research/trend_buy_candidates/latest.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('research/trend_buy_candidates/latest.json').read_text())
          assert x['mode']=='PROGRAM_VERIFIED_MODEL_RESEARCH_PENDING'
          assert x['checks']['model_invocations']==0
          assert all(1<=len(g['selected_codes'])<=5 for g in x['industries'])
          print('PROGRAM_MODEL_SCOPE_FREEZE',x['trade_date'],x['selected_company_count'])
          PY
      - name: Install existing quotation dependencies
        if: steps.admission.outputs.run == 'true'
        run: pip install -r requirements.txt
      - name: Collect same-session fund evidence for frozen TOP5 only
        if: steps.admission.outputs.run == 'true'
        run: |
          python scripts/freeze_trend_buy_fund_flow.py \
            --admission research/trend_buy_candidates/latest.json \
            --output /tmp/frozen-funded-admission.json
          mv /tmp/frozen-funded-admission.json research/trend_buy_candidates/latest.json
      - name: Commit only research admission; read back exact content
        if: steps.admission.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/trend_buy_candidates/latest.json
          if git diff --cached --quiet; then
            echo 'PROGRAM_ADMISSION_ALREADY_COMMITTED'
            exit 0
          fi
          git commit -m 'research: freeze canonical Python research intake'
          for i in 1 2 3; do
            git fetch origin main --quiet
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('research/trend_buy_candidates/latest.json').read_text())
          f=json.loads(Path('research/trend_buy_formal_result.json').read_text())
          raise SystemExit(0 if f.get('trade_date')==a['trade_date'] and isinstance(f.get('model_top1_selection'),dict) else 1)
          PY
            then
              echo 'SAME_DAY_MODEL_SELECTION_LOCKED_NO_ADMISSION_REWRITE'
              exit 0
            fi
            python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0,'scripts')
          from prepare_trend_buy_candidates import validate_admission,read
          validate_admission(Path('.'),read(Path('research/trend_buy_candidates/latest.json')))
          PY
            if git push origin HEAD:main; then
              git fetch origin main --quiet
              git show origin/main:research/trend_buy_candidates/latest.json | \
                cmp - research/trend_buy_candidates/latest.json
              echo 'PROGRAM_CANDIDATES_PUBLISHED_AND_READBACK'
              exit 0
            fi
            sleep "$i"
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: steps.admission.outputs.run == 'true'
        with:
          name: program-candidate-admission
          path: research/trend_buy_candidates/latest.json
          retention-days: 35
  test-fund-flow:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Unit and contract tests
        run: python -m unittest discover -s tests -p 'test_frozen_trend_buy_fund_flow.py'
      - name: Live same-session read-only verification
        run: |
          python - <<'PY'
          import datetime,json,subprocess,sys
          from zoneinfo import ZoneInfo
          from pathlib import Path
          path='research/trend_buy_candidates/latest.json'
          a=json.loads(Path(path).read_text())
          now=datetime.datetime.now(ZoneInfo('Asia/Shanghai'))
          if now.date().isoformat()!=a['trade_date'] or now.hour<15:
              print('LIVE_TEST_NOT_SAME_CLOSED_SESSION')
              sys.exit(0)
          subprocess.run([sys.executable,'scripts/freeze_trend_buy_fund_flow.py','--admission',path,'--output','/tmp/live-fund-test.json'],check=True)
          f=json.loads(Path('/tmp/live-fund-test.json').read_text())
          assert f['industries']==a['industries']
          print('LIVE_FUND_GROUPS',json.dumps([{k:g[k] for k in ('industry_code','status','provider','attempts')} for g in f['fund_flow']['groups']],ensure_ascii=False))
          assert all(g['status']=='VERIFIED' for g in f['fund_flow']['groups']), 'LIVE_SOURCE_UNAVAILABLE'
          PY
