name: A-share trend-buy frozen candidate admission
on:
  push:
    branches: [main]
    paths:
      - 'research/trend_handoff.json'
      - 'research/trend_buy_manual_rerun_request.json'
      - 'data/low_risk/index.json'
      - 'data/research/core_profit_refresh_latest.json'
      - 'scripts/prepare_trend_buy_candidates.py'
      - 'scripts/freeze_trend_buy_fund_flow.py'
      - 'scripts/trend_buy_revision.py'
      - 'requirements.txt'
      - 'scripts/trend_buy_prescreen_core.py'
      - 'scripts/build_trend_buy_manual_research.py'
      - '.github/workflows/prepare-trend-buy-candidates.yml'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/freeze_trend_buy_fund_flow.py'
      - 'scripts/trend_buy_revision.py'
      - 'scripts/prepare_trend_buy_candidates.py'
      - 'scripts/run_model_top1_formal.py'
      - 'tests/test_frozen_trend_buy_fund_flow.py'
      - 'tests/test_trend_buy_revision.py'
      - 'tests/test_run_model_top1_formal.py'
      - 'tests/test_trend_buy_admission.py'
      - '.github/workflows/prepare-trend-buy-candidates.yml'

permissions:
  contents: read

concurrency:
  group: trend-buy-candidate-admission-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing quotation dependencies
        run: pip install -r requirements.txt
      - name: Confirm closed upstream and preopen recovery window
        id: admission
        shell: bash
        run: |
          python - <<'PY'
          import json,os,sys
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          upstream=json.loads(Path('research/trend_handoff.json').read_text())
          idx=json.loads(Path('data/low_risk/index.json').read_text())
          sys.path.insert(0,'scripts')
          from trend_buy_revision import preopen_window, retryable_groups, same_session_result, active_manual_request
          now=datetime.now(ZoneInfo('Asia/Shanghai'))
          day=upstream.get('trade_date')
          previous=json.loads(Path('research/trend_buy_formal_result.json').read_text())
          retryable=retryable_groups(previous,day,now)
          manual=active_manual_request(previous,day,now=now)
          locked=same_session_result(previous,day) and not retryable and not manual
          window=preopen_window(day,now)
          # Preserve an already frozen same-source intake, including explicit
          # INCOMPLETE groups. Do not change its hash during model research.
          funded=False
          candidate=Path('research/trend_buy_candidates/latest.json')
          if candidate.exists() and window:
              sys.path.insert(0,'scripts')
              from prepare_trend_buy_candidates import validate_admission
              try:
                  old=json.loads(candidate.read_bytes())
                  if old.get('trade_date')==day and 'fund_flow' in old:
                      validate_admission(Path('.'),old)
                      statuses={g['industry_code']:g['status'] for g in old['fund_flow']['groups']}
                      funded=(old.get('manual_rerun_request_id')==manual['request_id'] if manual else (all(s=='VERIFIED' for s in statuses.values()) or (not retryable and os.getenv('GITHUB_EVENT_NAME')!='workflow_dispatch')))
              except (KeyError,ValueError,FileNotFoundError,TypeError):
                  pass
          allow=(window and not locked and not funded and idx.get('trade_date')==day
                 and idx.get('validation',{}).get('status')=='passed'
                 and bool(upstream.get('signals')))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('run='+('true' if allow else 'false')+'\n')
              out.write('manual_id='+(manual['request_id'] if manual else '')+'\n')
          print('PROGRAM_ADMISSION_DAY_STATUS',json.dumps({
              'now':now.isoformat(),'sector_date':day,'index_date':idx.get('trade_date'),
              'sector_signals':len(upstream.get('signals') or []),'same_day_locked':locked,'retryable_groups':sorted(retryable),'same_source_funded_admission_exists':funded,
              'will_run':allow,'manual_request_id':manual['request_id'] if manual else None},ensure_ascii=False))
          PY
      - name: Freeze program-only candidates (research starts after this)
        if: steps.admission.outputs.run == 'true'
        env:
          MANUAL_RERUN_ID: ${{ steps.admission.outputs.manual_id }}
        run: |
          cp research/trend_buy_candidates/latest.json /tmp/prior-admission.json
          python scripts/prepare_trend_buy_candidates.py \
            --output research/trend_buy_candidates/latest.json
          python - <<'PY'
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from trend_buy_revision import active_manual_request
          x=json.loads(Path('research/trend_buy_candidates/latest.json').read_text())
          assert x['mode']=='PROGRAM_VERIFIED_MODEL_RESEARCH_PENDING'
          assert x['checks']['model_invocations']==0
          prior=json.loads(Path('research/trend_buy_formal_result.json').read_text())
          manual=active_manual_request(prior,x['trade_date']) if os.getenv('MANUAL_RERUN_ID') else None
          if os.getenv('MANUAL_RERUN_ID'):
              assert manual and manual['request_id']==os.environ['MANUAL_RERUN_ID'],'MANUAL_RERUN_AUTHORIZATION_CHANGED'
              x['manual_rerun_request_id']=manual['request_id']
              Path('research/trend_buy_candidates/latest.json').write_text(json.dumps(x,ensure_ascii=False,indent=2,allow_nan=False)+'\n')
          elif prior.get('trade_date')==x['trade_date']:
              assert prior['python_top5_by_industry']==x['industries'],'REVISION_FROZEN_ROSTER_CHANGED'
              old=json.loads(Path('/tmp/prior-admission.json').read_text())
              protected={p['industry_code'] for p in prior['model_top1_selection']['items'] if p['status']!='INCOMPLETE'}
              if protected:
                  assert {k:v for k,v in old.items() if k!='fund_flow'}==x,'REVISION_PROTECTED_INPUT_CHANGED'
                  assert protected<={g['industry_code'] for g in old['fund_flow']['groups'] if g['status']=='VERIFIED'},'REVISION_PROTECTED_FUND_MISSING'
          assert all(1<=len(g['selected_codes'])<=5 for g in x['industries'])
          print('PROGRAM_MODEL_SCOPE_FREEZE',x['trade_date'],x['selected_company_count'])
          PY
      - name: Collect same-session fund evidence for frozen TOP5 only
        if: steps.admission.outputs.run == 'true'
        env:
          MANUAL_RERUN_ID: ${{ steps.admission.outputs.manual_id }}
        run: |
          prior=()
          if [ -z "$MANUAL_RERUN_ID" ]; then prior=(--prior-admission /tmp/prior-admission.json); fi
          python scripts/freeze_trend_buy_fund_flow.py \
            --admission research/trend_buy_candidates/latest.json \
            "${prior[@]}" \
            --output /tmp/frozen-funded-admission.json
          mv /tmp/frozen-funded-admission.json research/trend_buy_candidates/latest.json
      - name: Commit only research admission; read back exact content
        if: steps.admission.outputs.run == 'true'
        env:
          MANUAL_RERUN_ID: ${{ steps.admission.outputs.manual_id }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/trend_buy_candidates/latest.json
          if git diff --cached --quiet; then
            echo 'PROGRAM_ADMISSION_ALREADY_COMMITTED'
            exit 0
          fi
          git commit -m 'research: freeze canonical Python research intake'
          for i in 1 2 3; do
            git fetch origin main --quiet
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if ! python - <<'PY'
          import json,sys,os
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from trend_buy_revision import preopen_window,retryable_groups,same_session_result,active_manual_request
          a=json.loads(Path('research/trend_buy_candidates/latest.json').read_text())
          f=json.loads(Path('research/trend_buy_formal_result.json').read_text())
          day=a['trade_date']
          try:
              manual=active_manual_request(f,day) if os.getenv('MANUAL_RERUN_ID') else None
              if os.getenv('MANUAL_RERUN_ID'):
                  stop=not (manual and manual['request_id']==os.environ['MANUAL_RERUN_ID']==a.get('manual_rerun_request_id'))
              else:
                  stop=not preopen_window(day) or (same_session_result(f,day) and not retryable_groups(f,day))
          except Exception as exc:
              print('ADMISSION_PUBLISH_GUARD_FAILED',repr(exc))
              stop=True
          raise SystemExit(1 if stop else 0)
          PY
            then
              echo 'SAME_DAY_MODEL_SELECTION_LOCKED_NO_ADMISSION_REWRITE'
              if [ -n "$MANUAL_RERUN_ID" ]; then exit 1; fi
              exit 0
            fi
            python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0,'scripts')
          from prepare_trend_buy_candidates import validate_admission,read
          validate_admission(Path('.'),read(Path('research/trend_buy_candidates/latest.json')))
          PY
            if git push origin HEAD:main; then
              git fetch origin main --quiet
              git show origin/main:research/trend_buy_candidates/latest.json | \
                cmp - research/trend_buy_candidates/latest.json
              echo 'PROGRAM_CANDIDATES_PUBLISHED_AND_READBACK'
              exit 0
            fi
            sleep "$i"
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: steps.admission.outputs.run == 'true'
        with:
          name: program-candidate-admission
          path: research/trend_buy_candidates/latest.json
          retention-days: 35
  test-fund-flow:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Unit and contract tests
        run: |
          python -m unittest discover -s tests -p 'test_frozen_trend_buy_fund_flow.py'
          python -m unittest discover -s tests -p 'test_run_model_top1_formal.py'
          python -m unittest discover -s tests -p 'test_trend_buy_revision.py'
      - name: Live same-session read-only verification
        run: |
          python - <<'PY'
          import datetime,json,subprocess,sys
          from zoneinfo import ZoneInfo
          from pathlib import Path
          path='research/trend_buy_candidates/latest.json'
          a=json.loads(Path(path).read_text())
          now=datetime.datetime.now(ZoneInfo('Asia/Shanghai'))
          if now.date().isoformat()!=a['trade_date'] or now.hour<15:
              print('LIVE_TEST_NOT_SAME_CLOSED_SESSION')
              sys.exit(0)
          subprocess.run([sys.executable,'scripts/freeze_trend_buy_fund_flow.py','--admission',path,'--output','/tmp/live-fund-test.json'],check=True)
          f=json.loads(Path('/tmp/live-fund-test.json').read_text())
          assert f['industries']==a['industries']
          print('LIVE_FUND_GROUPS',json.dumps([{k:g[k] for k in ('industry_code','status','provider','attempts')} for g in f['fund_flow']['groups']],ensure_ascii=False))
          assert all(g['status']=='VERIFIED' for g in f['fund_flow']['groups']), 'LIVE_SOURCE_UNAVAILABLE'
          PY
