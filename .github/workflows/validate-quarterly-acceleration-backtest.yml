name: Retrospective quarterly acceleration shadow backtest

on:
  pull_request:
    paths:
      - 'scripts/backtest_quarterly_acceleration.py'
      - '.github/workflows/validate-quarterly-acceleration-backtest.yml'

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Retrospective frozen-candidate A/B (point-in-time finance, read-only)
        run: python scripts/backtest_quarterly_acceleration.py --output /tmp/quarterly_acceleration_backtest.json
      - name: Upload machine-readable backtest audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quarterly-financial-acceleration-asof-backtest
          path: /tmp/quarterly_acceleration_backtest.json
          retention-days: 30
          if-no-files-found: warn
      - name: Production artefacts remain untouched
        if: always()
        run: |
          git diff --exit-code -- data/latest.json research/trend_buy_formal_result.json research/trend_buy_handoff.json
