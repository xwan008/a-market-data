name: One-time robust current-contract cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/deversion-final-trigger.txt"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Keep one current contract only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          def get(path): return Path(path).read_text(encoding="utf-8")
          def put(path, text): Path(path).write_text(text, encoding="utf-8")

          # ---------- runtime / snapshot code ----------
          p = "scripts/split_snapshot.py"
          s = get(p)
          s = re.sub(r'RUNTIME_FORMAT = "model_ready_candidates_v\d+"', 'RUNTIME_FORMAT = "model_ready_candidates"', s)
          s = re.sub(
              r'def normalize_industry_yoy\(value: Any, source_unit: str \| None\) -> Any:\n.*?\n\ndef strong_support',
              'def industry_yoy_value(value: Any, source_unit: str | None) -> Any:\n    if source_unit != YOY_UNIT:\n        raise ValueError(f"unexpected industry YoY unit: {source_unit!r}")\n    return value\n\n\ndef strong_support',
              s, flags=re.S,
          )
          s = s.replace("normalize_industry_yoy(", "industry_yoy_value(")
          put(p, s)

          p = "scripts/build_screening_groups.py"
          s = re.sub(r'SCREENING_GROUP_FORMAT = "screening_group_view_v\d+"', 'SCREENING_GROUP_FORMAT = "screening_group_view"', get(p))
          put(p, s)

          p = "scripts/build_snapshot.py"
          s = get(p)
          s = re.sub(r'def industry_yoy_pct\(.*?\n\ndef compact_industries', 'def compact_industries', s, flags=re.S)
          s = s.replace(
              'def compact_industries(raw: dict[str, Any]) -> dict[str, Any]:\n    source_unit = raw.get("yoy_unit")\n    result: dict[str, Any] = {}',
              'def compact_industries(raw: dict[str, Any]) -> dict[str, Any]:\n    if raw.get("yoy_unit") != YOY_UNIT:\n        raise RuntimeError(\n            f"industry_state.yoy_unit must be {YOY_UNIT}, got {raw.get(\'yoy_unit\')!r}"\n        )\n    result: dict[str, Any] = {}',
          )
          s = re.sub(
              r'"aggregate_revenue_yoy": industry_yoy_pct\(\s*item\.get\("aggregate_revenue_yoy"\), source_unit\s*\),',
              '"aggregate_revenue_yoy": item.get("aggregate_revenue_yoy"),', s,
          )
          s = re.sub(
              r'"aggregate_parent_profit_yoy": industry_yoy_pct\(\s*item\.get\("aggregate_parent_profit_yoy"\), source_unit\s*\),',
              '"aggregate_parent_profit_yoy": item.get("aggregate_parent_profit_yoy"),', s,
          )
          s = re.sub(r'^\s*"schema_version":\s*2,\n', '', s, flags=re.M)
          put(p, s)

          p = "scripts/validate_snapshot.py"
          s = get(p)
          s = re.sub(r'^SNAPSHOT_SCHEMA_VERSION\s*=\s*\d+\n+', '', s, flags=re.M)
          s = re.sub(r'\n\s*if data\.get\("schema_version"\).*?\n\s*market_status =', '\n\n    market_status =', s, flags=re.S)
          put(p, s)

          p = "scripts/build_market_state.py"
          s = re.sub(r'^\s*"schema_version":\s*\d+,\n', '', get(p), flags=re.M)
          put(p, s)

          # ---------- industry state: current contract only ----------
          p = "scripts/build_industry_state.py"
          s = get(p)
          s = re.sub(r'\ndef normalize_carried_yoy\(.*?\n\ndef main\(\) -> int:', '\n\ndef main() -> int:', s, flags=re.S)
          marker = '    if OUTPUT.exists():\n        existing = json.loads(OUTPUT.read_text(encoding="utf-8"))\n'
          if marker in s and 'existing industry_state.yoy_unit must be' not in s:
              s = s.replace(marker, marker + '        if existing.get("yoy_unit") != YOY_UNIT:\n            raise SystemExit(\n                f"existing industry_state.yoy_unit must be {YOY_UNIT}, "\n                f"got {existing.get(\'yoy_unit\')!r}"\n            )\n')
          s = re.sub(r'^\s*existing_unit = existing\.get\("yoy_unit"\)\n', '', s, flags=re.M)
          s = re.sub(r'\s*carry\["aggregate_revenue_yoy"\] = normalize_carried_yoy\(.*?\)\n', '\n', s, flags=re.S)
          s = re.sub(r'\s*carry\["aggregate_parent_profit_yoy"\] = normalize_carried_yoy\(.*?\)\n', '\n', s, flags=re.S)
          s = re.sub(r'^\s*"schema_version":\s*\d+,\n', '', s, flags=re.M)
          put(p, s)

          put("scripts/ensure_industry_state_contract.py", '''#!/usr/bin/env python3\n\"\"\"Validate the single current industry-state contract.\"\"\"\nfrom __future__ import annotations\nimport argparse\nimport json\nfrom pathlib import Path\nfrom typing import Any\nfrom contracts import YOY_UNIT\n\nYOY_FIELDS = ("aggregate_revenue_yoy", "aggregate_parent_profit_yoy")\n\ndef is_number(value: Any) -> bool:\n    return isinstance(value, (int, float)) and not isinstance(value, bool)\n\ndef main() -> int:\n    parser = argparse.ArgumentParser()\n    parser.add_argument("path", nargs="?", default="data/research/industry_state.json")\n    args = parser.parse_args()\n    path = Path(args.path)\n    if not path.exists():\n        raise SystemExit(f"missing industry state: {path}")\n    payload = json.loads(path.read_text(encoding="utf-8"))\n    if payload.get("yoy_unit") != YOY_UNIT:\n        raise SystemExit(f"industry_state.yoy_unit must be {YOY_UNIT}, got {payload.get('yoy_unit')!r}")\n    industries = payload.get("level3_profitability")\n    if not isinstance(industries, dict) or not industries:\n        raise SystemExit("industry state has no level3_profitability data")\n    for code, item in industries.items():\n        if not isinstance(item, dict):\n            raise SystemExit(f"industry {code} must be an object")\n        for field in YOY_FIELDS:\n            value = item.get(field)\n            if value is not None and not is_number(value):\n                raise SystemExit(f"industry {code} {field} must be numeric or null")\n    print(f"industry state contract valid: yoy_unit={YOY_UNIT} industries={len(industries)}")\n    return 0\n\nif __name__ == "__main__":\n    raise SystemExit(main())\n''')

          # ---------- Protocol / README ----------
          p = "skill/RUNTIME_READ_PROTOCOL.md"
          s = get(p)
          s = s.replace("Frozen Ledger 的固定 schema、逐公司审计和并发写安全", "Frozen Ledger 的固定字段契约、逐公司审计和并发写安全")
          s = re.sub(r'## 6\. Frozen Ledger v\d+｜固定 schema 与逐公司审计', '## 6. Frozen Ledger｜固定字段契约与逐公司审计', s)
          s = re.sub(
              r'### 6\.1 固定版本\n.*?\n### 6\.2 必要顶层字段',
              '### 6.1 当前唯一字段契约\n\n本 Protocol 直接定义当前唯一有效 Ledger 字段契约。运行时不得识别、迁移或兼容历史 Ledger 格式；任何不符合当前必需字段、逐公司审计和集合闭合要求的 Ledger 都视为无效。\n\n### 6.2 必要顶层字段',
              s, flags=re.S,
          )
          s = ''.join(line for line in s.splitlines(True) if 'ledger_version' not in line)
          # Re-number only the Hard Gate validation list after removing the version item.
          a = s.index('Hard Gate 必须同时验证：')
          b = s.index('\n\n任一条件失败：', a)
          block = s[a:b]
          n = 0
          lines = []
          for line in block.splitlines():
              if re.match(r'^\d+\. ', line):
                  n += 1
                  line = re.sub(r'^\d+\.', f'{n}.', line)
              lines.append(line)
          s = s[:a] + '\n'.join(lines) + s[b:]
          put(p, s)

          p = "README.md"
          s = get(p)
          s = re.sub(r'## Frozen Ledger v\d+｜', '## Frozen Ledger｜', s)
          s = re.sub(r'\n当前固定 schema：\n\n```text\n.*?\n```\n', '\n当前 Ledger 字段契约由 `skill/RUNTIME_READ_PROTOCOL.md` 直接定义，不维护历史 schema 分支或兼容层。\n', s, flags=re.S)
          s = ''.join(line for line in s.splitlines(True) if 'ledger_version' not in line)
          put(p, s)

          # ---------- current persisted state ----------
          ledger_path = Path("research/pre_research_ledger.json")
          ledger = json.loads(ledger_path.read_text(encoding="utf-8"))
          ledger.pop("ledger_version", None)
          ledger_path.write_text(json.dumps(ledger, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          for path in ("data/research/industry_state.json", "data/market_state.json"):
              fp = Path(path)
              obj = json.loads(fp.read_text(encoding="utf-8"))
              obj.pop("schema_version", None)
              obj.pop("unit_migration", None)
              fp.write_text(json.dumps(obj, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          # Source-contract assertions before rebuild.
          formal = [
              "skill/RUNTIME_READ_PROTOCOL.md", "README.md", "research/pre_research_ledger.json",
              "scripts/split_snapshot.py", "scripts/build_screening_groups.py", "scripts/build_snapshot.py",
              "scripts/validate_snapshot.py", "scripts/build_market_state.py", "scripts/build_industry_state.py",
              "scripts/ensure_industry_state_contract.py",
          ]
          banned = ["ledger_version", "model_ready_candidates_v2", "screening_group_view_v1", "LEGACY_SCHEMA_VERSION", "CURRENT_SCHEMA_VERSION", "normalize_carried_yoy", "industry_yoy_pct", '"schema_version":']
          for path in formal:
              hits = [x for x in banned if x in get(path)]
              if hits:
                  raise SystemExit(f"version/legacy residue in {path}: {hits}")
          PY

      - name: Rebuild current outputs
        shell: bash
        run: |
          python scripts/ensure_industry_state_contract.py data/research/industry_state.json
          python scripts/build_snapshot.py --source . --output data/snapshot.json
          python scripts/attach_market_state.py data/snapshot.json
          python scripts/normalize_snapshot_source.py data/snapshot.json
          python scripts/validate_snapshot.py data/snapshot.json
          python scripts/build_runtime.py data/snapshot.json --output-dir data/runtime

      - name: Final assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          ledger = json.loads(Path("research/pre_research_ledger.json").read_text())
          snapshot = json.loads(Path("data/snapshot.json").read_text())
          industry = json.loads(Path("data/research/industry_state.json").read_text())
          market = json.loads(Path("data/market_state.json").read_text())
          meta = json.loads(Path("data/runtime/meta.json").read_text())
          cand = json.loads(Path("data/runtime/candidates.json").read_text())
          groups = json.loads(Path("data/runtime/screening_groups.json").read_text())
          assert "ledger_version" not in ledger
          assert "schema_version" not in snapshot and "schema_version" not in industry and "schema_version" not in market
          assert "schema_version" not in (snapshot.get("market_state") or {})
          assert "schema_version" not in (meta.get("snapshot") or {})
          assert "schema_version" not in ((meta.get("snapshot") or {}).get("market_state") or {})
          assert meta["runtime_format"] == cand["runtime_format"] == "model_ready_candidates"
          assert meta["screening_group_format"] == groups["runtime_format"] == "screening_group_view"
          assert meta["runtime_validation"]["status"] == "passed"
          assert meta["screening_group_validation"]["status"] == "passed"
          print("final single-contract assertions passed")
          PY

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md skill research scripts data
          git commit -m "refactor: keep only the current formal contract"
          git push origin HEAD:main
