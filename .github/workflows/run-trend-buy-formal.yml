name: A-share trend-buy formal mainline run
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/trend_buy_company_reviews/latest.json"
permissions:
  contents: write
concurrency:
  group: trend-buy-mainline-formal-publish
  cancel-in-progress: false
jobs:
  formal-mainline:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing calendar/quote dependencies
        run: pip install -r requirements.txt
      - name: Verify confirmed-only upstream and exact frozen research input
        id: admission
        run: |
          python - <<'PY'
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from validate_trend_publication_pair import validate
          from validate_theme_handoff_routes import check_theme_routes
          from prepare_trend_buy_candidates import validate_admission
          from trend_buy_revision import same_session_result,validate_revision,active_manual_request
          read=lambda p:json.loads(Path(p).read_bytes())
          registry=read('research/trend_registry.json')
          handoff=read('research/trend_handoff.json')
          day=handoff['trade_date']
          assert day >= '2026-10-27'
          errors=validate(registry,handoff)
          assert not errors,errors
          if not handoff['signals']:
              run='false'
              print('NO_ELIGIBLE_CONFIRMED_TREND')
          else:
              index=read('data/low_risk/index.json')
              check_theme_routes(handoff,index,registry)
              assert index['trade_date']==day and index['validation']['status']=='passed'
              admission=read('research/trend_buy_candidates/latest.json')
              assert admission['trade_date']==day
              validate_admission(Path('.'),admission)
              evidence=read('research/trend_buy_company_reviews/latest.json')
              assert evidence['as_of_date']==day
              assert evidence['explicit_no_prior_formal_or_archive_input'] is True
              assert evidence['top1_selection']['prompt_version']=='V1.6-R1'
              previous=read('research/trend_buy_formal_result.json')
              if same_session_result(previous,day) and previous['model_top1_selection']==evidence['top1_selection']:
                  run='false'
                  print('EXACT_EXISTING_RESULT_NO_REPUBLICATION')
              else:
                  assert 'fund_flow' in admission, 'NEW_FORMAL_RUN_REQUIRES_FROZEN_FUND_SNAPSHOT'
                  manual=active_manual_request(previous,day)
                  validate_revision(previous,admission,evidence,manual_request=manual)
                  run='true'
                  print('PREOPEN_FORMAL_GATE_PASSED',day,'recovery' if same_session_result(previous,day) else 'initial')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('should_run='+run+'\n')
          PY
      - name: Prepare same-session technical evidence
        if: steps.admission.outputs.should_run == 'true'
        run: |
          python scripts/build_history.py
          python scripts/build_bridge.py
      - name: Reproduce frozen candidate scope and company facts without model ranks
        if: steps.admission.outputs.should_run == 'true'
        run: |
          python scripts/build_trend_buy_manual_research.py \
            --model-top1-research \
            --evidence research/trend_buy_company_reviews/latest.json \
            --admission research/trend_buy_candidates/latest.json \
            --structure-output /tmp/mainline-scoped-structure.json \
            --output /tmp/mainline-fresh-research.json
      - name: Compute only selected TOP1 risk and stage sole formal result
        if: steps.admission.outputs.should_run == 'true'
        run: |
          python scripts/run_model_top1_formal.py \
            --admission research/trend_buy_candidates/latest.json \
            --research /tmp/mainline-fresh-research.json \
            --structure /tmp/mainline-scoped-structure.json \
            --evidence research/trend_buy_company_reviews/latest.json \
            --previous research/trend_buy_formal_result.json \
            --run-id "trend-buy-formal-main-${GITHUB_RUN_ID}" \
            --output /tmp/mainline-fresh-result.json
          python - <<'PY'
          import json,subprocess,os
          from pathlib import Path
          import sys
          sys.path.insert(0,'scripts')
          from trend_buy_revision import same_session_result,validate_protected_outputs,validate_revision,active_manual_request
          read=lambda p:json.loads(Path(p).read_bytes())
          res=read('/tmp/mainline-fresh-result.json')
          research=read('/tmp/mainline-fresh-research.json')
          technical=read('/tmp/mainline-scoped-structure.json')
          audit=research['screen_audit']
          assert res['trade_date']==research['trade_date']==technical['reference_trade_date']
          assert audit['hard_eligible']==len(audit['lightweight_scanned'])
          assert audit['hard_eligible']==len(audit['pre_screen_selected'])+len(audit['pre_screened_out'])
          assert audit['research_scope']=='python_top5_before_model_review'
          assert audit['source_review_pending_count']==0
          assert res['coverage']['selected']==research['selected_company_count']==len(audit['pre_screen_selected'])
          assert res['coverage']['judged']==sum(res['summary'].values())
          assert res['production_eligible'] and res['selection_policy']=='MODEL_TOP1_V1_6_R1'
          res['fresh_mainline_provenance']={
              'source_trade_date':res['trade_date'],
              'run':'frozen_top5_locked_model_top1_independent_risk',
              'old_formal_or_replay_used_as_input':False,
              'github_actions_run_id':os.environ['GITHUB_RUN_ID'],
              'technical_rebuilt_at':technical['generated_at']}
          for key,path in [('industry_handoff_sha','research/trend_handoff.json'),
              ('frozen_company_index_sha','data/low_risk/index.json'),
              ('company_review_sha','research/trend_buy_company_reviews/latest.json'),
              ('company_research_admission_sha','research/trend_buy_candidates/latest.json')]:
              res['fresh_mainline_provenance'][key]=subprocess.check_output(['git','rev-parse','HEAD:'+path],text=True).strip()
          previous=read('research/trend_buy_formal_result.json')
          manual=active_manual_request(previous,res['trade_date'])
          validate_revision(previous,read('research/trend_buy_candidates/latest.json'),read('research/trend_buy_company_reviews/latest.json'),manual_request=manual)
          validate_protected_outputs(previous,res,manual_request=manual)
          if manual:
              res['manual_full_rerun']={**manual,'rerun_industries':[p['industry_code'] for p in res['model_top1_selection']['items']]}
          elif same_session_result(previous,res['trade_date']):
              res['preopen_recovery']={
                  'reason':'RETRY_INCOMPLETE_RESEARCH_BEFORE_NEXT_OPEN',
                  'supersedes_formal_blob_sha':subprocess.check_output(['git','rev-parse','HEAD:research/trend_buy_formal_result.json'],text=True).strip(),
                  'supersedes_handoff_blob_sha':subprocess.check_output(['git','rev-parse','HEAD:research/trend_buy_handoff.json'],text=True).strip(),
                  'supersedes_run_id':previous['run_id'],
                  'retried_industries':[p['industry_code'] for p in previous['model_top1_selection']['items'] if p['status']=='INCOMPLETE']}
          Path('research/trend_buy_formal_result.json').write_text(json.dumps(res,ensure_ascii=False,indent=2,allow_nan=False)+'\n',encoding='utf-8')
          PY
          sha=$(git hash-object research/trend_buy_formal_result.json)
          python scripts/trend_buy_handoff.py --result research/trend_buy_formal_result.json \
            --result-blob-sha "$sha" --output research/trend_buy_handoff.json
          python - <<'PY'
          import json
          from pathlib import Path
          f=json.loads(Path('research/trend_buy_formal_result.json').read_bytes())
          h=json.loads(Path('research/trend_buy_handoff.json').read_bytes())
          assert h['trade_date']==f['trade_date'] and h['source_run_id']==f['run_id']
          assert h['shadow'] is False
          assert [x['code'] for x in h['items']]==[x['top1_code'] for x in f['top1_decisions'] if x['risk_status'] in ('READY','WAIT')]
          print('TOP1_HANDOFF_SCOPE_VERIFIED',len(h['items']))
          PY
      - name: Atomically publish both artifacts and verify main readback
        if: steps.admission.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          python - <<'PY'
          import json,sys,subprocess
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from trend_buy_revision import validate_revision,validate_protected_outputs,active_manual_request
          old=json.loads(subprocess.check_output(['git','show','HEAD:research/trend_buy_formal_result.json']))
          a=json.loads(Path('research/trend_buy_candidates/latest.json').read_bytes())
          e=json.loads(Path('research/trend_buy_company_reviews/latest.json').read_bytes())
          f=json.loads(Path('research/trend_buy_formal_result.json').read_bytes())
          manual=active_manual_request(old,f['trade_date'])
          validate_revision(old,a,e,manual_request=manual)
          validate_protected_outputs(old,f,manual_request=manual)
          if manual:
              assert all(f['manual_full_rerun'].get(k)==value for k,value in manual.items()),'MANUAL_RERUN_AUDIT_MISMATCH'
          PY
          git add research/trend_buy_formal_result.json research/trend_buy_handoff.json
          git commit -m "research: sole formal locked TOP1 result and handoff"
          python - <<'PY'
          import json,sys
          sys.path.insert(0,"scripts")
          from trend_buy_revision import preopen_window
          assert preopen_window(json.load(open("research/trend_buy_formal_result.json"))["trade_date"]), "NEXT_SESSION_OPEN_NO_PUBLISH"
          PY
          git push origin HEAD:main
          git fetch origin main
          for p in research/trend_buy_formal_result.json research/trend_buy_handoff.json; do
            git show "origin/main:$p" | cmp - "$p"
          done
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          f=json.loads(Path('research/trend_buy_formal_result.json').read_bytes())
          h=json.loads(Path('research/trend_buy_handoff.json').read_bytes())
          sha=subprocess.check_output(['git','rev-parse','origin/main:research/trend_buy_formal_result.json'],text=True).strip()
          assert h['source_formal_blob_sha']==sha
          print('FINAL_MAIN_HANDOFF_READBACK_OK',f['trade_date'],f['run_id'],sha,len(h['items']))
          PY
