name: Rebuild Hard Filters Once

on:
  push:
    paths:
      - '.github/workflows/rebuild-hard-filter-once.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Rebuild snapshot with hard filters
        run: |
          python scripts/build_snapshot.py --source . --output data/snapshot.json
          python scripts/attach_market_state.py data/snapshot.json
          python scripts/normalize_snapshot_source.py data/snapshot.json
          python scripts/validate_snapshot.py data/snapshot.json

      - name: Verify hard caps explicitly
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data/snapshot.json').read_text(encoding='utf-8'))
          candidates = data.get('candidates') or {}
          assert candidates
          for code, item in candidates.items():
              assert item['price'] <= 150, (code, item['price'])
              f = item.get('fundamentals') or {}
              for key in ('pe_ttm', 'pe_dynamic'):
                  value = f.get(key)
                  if isinstance(value, (int, float)) and not isinstance(value, bool):
                      assert value <= 30, (code, key, value)
          print({'trade_date': data.get('trade_date'), 'candidates': len(candidates)})
          PY

      - name: Commit rebuilt snapshot
        run: |
          if git diff --quiet -- data/snapshot.json; then
            echo 'snapshot unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/snapshot.json
          git commit -m 'data: apply price and PE hard filters'
          git pull --rebase origin main
          git push origin HEAD:main
