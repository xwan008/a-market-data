name: Update Weekly Research Data

on:
  workflow_dispatch:
  schedule:
    # Sunday 18:30 China time: fall back only if the 17:00 external weekly refresh did not complete.
    - cron: '30 10 * * 0'
  push:
    branches:
      - main
    paths:
      - ".github/external-trigger-weekly.txt"

permissions:
  contents: write

concurrency:
  group: update-weekly-research
  cancel-in-progress: false

jobs:
  check_weekly_freshness:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.guard.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip native Sunday fallback when external Sunday finance refresh succeeded
        id: guard
        shell: bash
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json,os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          allowed=True
          reason="manual_or_external_push"
          if os.environ.get("TRIGGER_EVENT")=="schedule":
              now=datetime.now(ZoneInfo("Asia/Shanghai"))
              try:
                  current=json.loads(Path("data/latest.json").read_text(encoding="utf-8"))
                  stamp=datetime.fromisoformat(current.get("generated_at","")).astimezone(
                      ZoneInfo("Asia/Shanghai"))
                  stats=current.get("fundamental_stats") or {}
                  n=len(current.get("stocks") or {})
                  core=int(stats.get("deduct_profit_growth_usable") or 0)
                  if (stamp.date()==now.date() and stamp.hour>=16
                          and n>=3000 and core/n>=.75):
                      allowed=False
                      reason="externally_refreshed_this_sunday_with_core_financial_coverage"
                  else:
                      reason="native_weekly_fallback_needed"
              except (OSError,ValueError,TypeError):
                  reason="native_weekly_fallback_missing_audit"
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write("should_run="+("true" if allowed else "false")+"\n")
          print("WEEKLY_FINANCE_RUN_DECISION",reason,allowed)
          PY

  update:
    needs: check_weekly_freshness
    if: needs.check_weekly_freshness.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Preserve previous verified market dataset
        shell: bash
        run: |
          if [ -f data/latest.json ]; then
            cp data/latest.json /tmp/latest.previous.json
          fi

      - name: Refresh full financial and valuation data
        run: python scripts/fetch_market_resilient.py

      - name: Restore prior valuation if the valuation source is transiently unavailable
        run: |
          python scripts/restore_valuation_fallback.py \
            --current data/latest.json \
            --previous /tmp/latest.previous.json

      - name: Enrich core earnings from verified F10 batches (no quote refresh)
        run: |
          python scripts/refresh_core_financial_only.py \
            --input data/latest.json \
            --output /tmp/weekly-core-profit-shadow.json \
            --batch-size 40 --workers 4 --min-core-coverage 0.75 --apply
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/weekly-core-profit-shadow.json').read_text())
          p=json.loads(Path('data/latest.json').read_text())
          assert p['trade_date']==r['asof_date']
          assert r['after_deduct_growth_usable']/r['stocks']>=.75
          assert (p['fundamental_stats']['deduct_profit_growth_usable']
                  ==r['after_deduct_growth_usable'])
          assert not r['source_data_retrieval_incomplete']
          print('WEEKLY_CORE_FINANCIAL_PASS',r['after_deduct_growth_usable'],r['stocks'])
          PY

      - name: Persist verified F10 evidence snapshot for V4 shadow input
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/weekly-core-profit-shadow.json').read_text(encoding='utf-8'))
          market=json.loads(Path('data/latest.json').read_text(encoding='utf-8'))
          total=r['stocks']
          assert total>=3000
          assert r['asof_date']==market['trade_date']
          assert r['source']=='eastmoney_RPT_F10_FINANCE_MAINFINADATA'
          assert r['after_deduct_growth_usable']/total>=.75
          assert not r['source_data_retrieval_incomplete']
          assert (r['after_deduct_growth_usable']
                  ==market['fundamental_stats']['deduct_profit_growth_usable'])
          for code,entry in r['records'].items():
              assert code==entry['code']
              assert entry['report_date']<=r['asof_date']
              assert entry['notice_date']<=r['asof_date']
              assert not entry['update_date'] or entry['update_date']<=r['asof_date']
          snapshot={
              'schema_version':1,
              'result_kind':'date_verified_financial_only_evidence',
              'asof_trade_date':r['asof_date'],
              'generated_at':r['generated_at'],
              'source':r['source'],
              'stocks':r['stocks'],
              'prior_deduct_growth_usable':r['prior_deduct_growth_usable'],
              'after_deduct_growth_usable':r['after_deduct_growth_usable'],
              'after_core_amount_usable':r['after_core_amount_usable'],
              'records':r['records'],
              'no_republication_of_old_formal_trend_buy':True,
          }
          destination=Path('data/research/core_profit_refresh_latest.json')
          destination.parent.mkdir(parents=True,exist_ok=True)
          destination.write_text(
              json.dumps(snapshot,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          assert json.loads(destination.read_text())['asof_trade_date']==market['trade_date']
          print('V4_WEEKLY_CORE_EVIDENCE_READBACK',snapshot['asof_trade_date'],
                snapshot['after_deduct_growth_usable'],snapshot['stocks'])
          PY

      - name: Validate weekly financial coverage
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          latest = json.loads(Path('data/latest.json').read_text(encoding='utf-8'))
          stocks = latest.get('stocks') or {}
          total = len(stocks)
          stats = latest.get('fundamental_stats') or {}
          financial = int(stats.get('financial_usable') or 0)
          valuation = int(stats.get('valuation_usable') or 0)
          status = str(latest.get('market_status') or '')

          assert status in {'closed', 'closed_or_no_trade'}, status
          assert total >= 3000, total
          assert financial / total >= 0.95, (financial, total)
          assert valuation / total >= 0.95, (valuation, total)
          print({
              'trade_date': latest.get('trade_date'),
              'stocks': total,
              'financial_coverage': round(financial / total, 4),
              'valuation_coverage': round(valuation / total, 4),
          })
          PY

      - name: Rebuild quote shards with refreshed fundamentals
        run: python scripts/build_bridge.py

      - name: Reapply and validate industry mapping
        run: |
          python scripts/enrich_shards_with_industry.py
          python - <<'PY'
          import json
          from pathlib import Path
          total = mapped = 0
          for path in Path('data/shards').glob('*.json'):
              payload = json.loads(path.read_text(encoding='utf-8'))
              for stock in (payload.get('stocks') or {}).values():
                  total += 1
                  mapped += int(stock.get('industry_mapping_status') == 'mapped')
          coverage = mapped / total if total else 0
          assert coverage >= 0.97, coverage
          print({'industry_mapping_coverage': round(coverage, 4), 'mapped': mapped, 'stocks': total})
          PY

      - name: Rebuild frozen company screening working sets
        run: python scripts/build_low_risk_working_sets.py

      - name: Commit updated weekly research data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage first, then decide whether there is anything to persist.
          # Force-add low_risk so formatting-only/materialization changes are never skipped.
          git add -A data
          git add -f -A data/low_risk

          echo "staged weekly data diff:"
          git diff --cached --stat -- data || true

          if git diff --cached --quiet -- data; then
            echo "weekly research data unchanged after staging"
            exit 0
          fi

          git commit -m "data: refresh weekly research dataset"

          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
