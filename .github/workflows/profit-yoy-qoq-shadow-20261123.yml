name: Profit YoY/QoQ frozen shadow 2026-11-23 (branch only)
on:
  push:
    branches: ["shadow/profit-yoy-qoq-20261123"]
    paths:
      - "experiments/profit_yoy_qoq_shadow_20261123.py"
      - ".github/workflows/profit-yoy-qoq-shadow-20261123.yml"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test baseline and read-only shadow candidate/attention replay
        run: |
          python experiments/profit_yoy_qoq_shadow_20261123.py --output /tmp/profit_shadow_20261123.json
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path('/tmp/profit_shadow_20261123.json').read_text())
          assert x['baseline_replayed'] is True
          assert x['official_ready_wait_unchanged'] is True
          assert x['qoq_metric_status'].startswith('BLOCKED_')
          assert sum(g['hard_eligible'] for g in x['financial_source_coverage']) >= 38
          assert len(x['original_frozen_cohort_attention_differences']) == 3
          assert len(x['financial_metrics_for_all_hard_eligible']) >= 38
          print('SHADOW_READ_ONLY_AND_COVERAGE_VERIFIED', x['original_cohort_rank_changes'])
          PY
      - name: Verify official artifacts and all tracked files remain unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code
      - name: Upload non-production shadow report
        uses: actions/upload-artifact@v4
        with:
          name: profit-shadow-20261123
          path: /tmp/profit_shadow_20261123.json
          retention-days: 35
