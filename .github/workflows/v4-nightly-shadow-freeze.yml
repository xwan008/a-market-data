name: V4 B1 program-only nightly shadow freeze

on:
  schedule:
    # 19:35 Asia/Shanghai, after 19:00 official daily buy research
    - cron: '35 11 * * 1-5'
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/trend-buy-v4-nightly-shadow-freeze-20261106
    paths:
      - '.github/workflows/v4-nightly-shadow-freeze.yml'
      - '.github/external-trigger-v4-shadow.txt'
  pull_request:
    paths:
      - '.github/workflows/v4-nightly-shadow-freeze.yml'

permissions:
  contents: read

concurrency:
  group: v4-shadow-program-freeze-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && 'main' || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refuse stale, missing or unconfirmed official daily source
        env:
          EVENT_KIND: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          form=json.loads(Path('research/trend_buy_formal_result.json').read_text())
          industry=json.loads(Path('data/low_risk/index.json').read_text())
          source=json.loads(Path('data/research/core_profit_refresh_latest.json').read_text())
          day=form['trade_date']
          now=datetime.now(ZoneInfo('Asia/Shanghai')).date().isoformat()
          assert form.get('status')=='COMPLETE', 'formal_result_not_complete'
          assert form.get('top5_by_theme'), 'no_valid_confirmed_industries'
          assert day==industry['trade_date'], 'industry_index_stale'
          assert day<=now, 'future_trade_date'
          assert source.get('source')=='eastmoney_RPT_F10_FINANCE_MAINFINADATA'
          assert source.get('records'), 'core_finance_missing'
          assert source['asof_trade_date']<=day, 'future_financial_source_snapshot'
          from datetime import date
          assert (date.fromisoformat(day)-date.fromisoformat(
                  source['asof_trade_date'])).days<=14, 'core_finance_source_too_old'
          if os.environ['EVENT_KIND']=='schedule':
              assert day==now, 'official_19h_research_not_published_for_today'
          print('V4_SHADOW_INPUT_AUDIT',json.dumps({
              'market_date':day,'financial_snapshot_date':source['asof_trade_date'],
              'event_kind':os.environ['EVENT_KIND'],
              'original_topics':[g['trend_name'] for g in form['top5_by_theme']]},
              ensure_ascii=False))
          PY
      - name: Load V4-B1 implementation from review-only research branch
        run: |
          git fetch --no-tags --depth=1 origin \
            feature/trend-buy-v4-financial-factorial-shadow-20261106
          V4_EXPECTED_RESEARCH_SHA=4749d6c51b614eeb9761646771d8e3d8fa68f030
          V4_ACTUAL_RESEARCH_SHA="$(git rev-parse FETCH_HEAD)"
          test "$V4_ACTUAL_RESEARCH_SHA" = "$V4_EXPECTED_RESEARCH_SHA" || {
            echo "V4_SHADOW_RESEARCH_COMMIT_CHANGED_REQUIRES_REVIEW"
            exit 1
          }
          echo "$V4_ACTUAL_RESEARCH_SHA" > /tmp/v4-nightly-program-commit.txt
          echo "V4_SHADOW_RESEARCH_CODE_SHA=$V4_ACTUAL_RESEARCH_SHA"
          mkdir -p experiments
          for path in \
            scripts/build_trend_buy_manual_research.py \
            experiments/trend_buy_v4_python_prescreen_shadow.py \
            experiments/trend_buy_v4_financial_factorial_shadow.py; do
            git show "FETCH_HEAD:$path" > "$path"
          done
          python -m py_compile \
            scripts/build_trend_buy_manual_research.py \
            experiments/trend_buy_v4_python_prescreen_shadow.py \
            experiments/trend_buy_v4_financial_factorial_shadow.py
      - name: Run Python full hard-filter then old-A1/V4-B1 matched prescreen
        run: |
          python scripts/build_trend_buy_manual_research.py \
            --evidence research/trend_buy_company_reviews/latest.json \
            --output /tmp/v4-nightly-original-shadow.json
          python experiments/trend_buy_v4_financial_factorial_shadow.py \
            --root . \
            --screen /tmp/v4-nightly-original-shadow.json \
            --finance data/research/core_profit_refresh_latest.json \
            --output /tmp/v4-nightly-candidates-shadow.json
      - name: Verify date, membership budget, and publish readable model-scope summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          source=json.loads(Path('research/trend_buy_formal_result.json').read_text())
          out=json.loads(Path('/tmp/v4-nightly-candidates-shadow.json').read_text())
          assert out['asof_date']==source['trade_date'],'date_mismatch'
          assert out['model_reviews_executed']==0
          assert out['trade_readiness_unchanged']
          assert out['mode']=='SHADOW_FOUR_WAY_UNREVIEWED_PRESCREEN'
          assert len(out['industry_groups'])>0
          for group in out['industry_groups']:
              a=group['cases']['ORIGINAL_CORE_FIRST']
              b=group['cases']['V4_CORE_FIRST']
              assert 0<len(b)<=5,('V4_B1_INVALID',group['industry_code'])
              assert 0<len(a)<=5
              assert len(set(b))==len(b)
              assert len(set(a))==len(a)
              record={
                  'date':out['asof_date'],'industry':group['industry_code'],
                  'A1_python_top5':a,'V4_B1_python_top5':b,
                  'extra_v4_model_reviews':group['new_model_review_required_vs_original'],
                  'core_earnings_matched_count':group['core_evidence_patched_count'],
                  'source_rejections':group['source_audit'],
                  'permission':'SHADOW_ONLY_MODEL_RESEARCH_PENDING',
              }
              print('V4_DAILY_MODEL_TOP5',json.dumps(record,ensure_ascii=False))
          print('V4_PROGRAM_READY_FOR_MODEL_POSTSCREEN',
                len(out['industry_groups']),out['asof_date'])
          PY
      - name: Verify formal result, handoff, and immutable daily price files untouched
        run: |
          git diff --exit-code -- research/trend_buy_formal_result.json \
            research/trend_buy_handoff.json data/latest.json
          test "$(git hash-object research/trend_buy_formal_result.json)" = \
            "$(git rev-parse HEAD:research/trend_buy_formal_result.json)"
          test "$(git hash-object research/trend_buy_handoff.json)" = \
            "$(git rev-parse HEAD:research/trend_buy_handoff.json)"
      - name: Save source-checked manifest for 20:15 model research
        env:
          CI_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          source=json.loads(Path('research/trend_buy_formal_result.json').read_text())
          handoff=json.loads(Path('research/trend_handoff.json').read_text())
          finance=json.loads(Path('data/research/core_profit_refresh_latest.json').read_text())
          result=json.loads(Path('/tmp/v4-nightly-candidates-shadow.json').read_text())
          def blob(path):
              return subprocess.check_output(
                  ['git','rev-parse','HEAD:'+path],text=True).strip()
          manifest={
              'mode':'V4_B1_PROGRAM_ONLY_COMPLETE',
              'market_date':source['trade_date'],
              'confirmed_sector_date':handoff['trade_date'],
              'finance_source_date':finance['asof_trade_date'],
              'finance_source':'eastmoney_RPT_F10_FINANCE_MAINFINADATA',
              'official_result_git_blob_sha':blob('research/trend_buy_formal_result.json'),
              'industry_handoff_git_blob_sha':blob('research/trend_handoff.json'),
              'frozen_industry_index_git_blob_sha':blob('data/low_risk/index.json'),
              'finance_git_blob_sha':blob('data/research/core_profit_refresh_latest.json'),
              'research_code_commit':Path('/tmp/v4-nightly-program-commit.txt').read_text().strip(),
              'github_actions_run_id':os.environ['CI_RUN_ID'],
              'no_model_research_yet':True,
              'model_max_stocks_per_sw3':5,
              'industry_count':len(result['industry_groups']),
              'industry_codes':[x['industry_code'] for x in result['industry_groups']],
              'model_research_ready':True,
              'production_promoted':False,
          }
          assert manifest['market_date']==manifest['confirmed_sector_date']==result['asof_date']
          assert all(0<len(x['cases']['V4_CORE_FIRST'])<=5
                     for x in result['industry_groups'])
          out=Path('/tmp/v4-nightly-candidate-manifest.json')
          out.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          print('V4_VERIFIED_PYTHON_HANDOFF',json.dumps(manifest,ensure_ascii=False))
          PY
      - name: Save same-date program-only candidates for after-20:15 model research
        uses: actions/upload-artifact@v4
        with:
          name: v4-b1-daily-python-top5-shadow
          path: |
            /tmp/v4-nightly-original-shadow.json
            /tmp/v4-nightly-candidates-shadow.json
            /tmp/v4-nightly-candidate-manifest.json
          retention-days: 35
