name: Verify mainboard concept source stability (shadow)

on:
  push:
    branches: [feature/hotspot-theme-identification-20261026]
    paths: [".github/workflows/probe-mainboard-stability.yml"]

permissions:
  contents: read

jobs:
  mainboard-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned normal deps and adata
        run: |
          python -m pip install -r requirements.txt
          python -m pip install adata
      - name: Three independent verified THS concept-member requests
        run: |
          python -u scripts/probe_mainboard_concept_stability.py
      - name: Isolated same-day main-board routing
        run: |
          python scripts/build_full_market_price_structure.py
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('/tmp/mainboard_ths_stability_20261026.json').read_text())
          assert report['market_scope']=='SH_SZ_MAINBOARD_ONLY'
          assert report['mainboard_quote_coverage']>=.95, 'MAINBOARD_QUOTE_COVERAGE_TOO_LOW'
          snapshot={
              'schema_version':1,'source':'THS_ADATA',
              'as_of_trade_date':'2026-10-26',
              'catalog_scope':'SINGLE_BOARD_ONLY',
              'concepts':[{
                  'concept_id':report['concept_index_code'],
                  'name':report['concept_name'],
                  'source':'THS_ADATA',
                  'member_codes':report['full_member_codes'],
              }],
          }
          Path('/tmp/one_board_catalog.json').write_text(
              json.dumps(snapshot,ensure_ascii=False))
          print('MAINBOARD_COVERAGE_GATE_OK',report['mainboard_quote_coverage'],flush=True)
          PY
          python scripts/route_hotspot_themes.py \
            --concept-file /tmp/one_board_catalog.json \
            --output-dir /tmp/mainboard_stability_shadow
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/mainboard_stability_shadow/2026-10-26.json').read_text())
          signal=r['routes'][0]
          assert r['market_scope']=='SH_SZ_MAINBOARD_ONLY'
          assert signal['hotspot_type']=='DATA_INSUFFICIENT', 'SINGLE_BOARD_CATALOG_MUST_NOT_CONFER_FULL_CLASSIFICATION'
          assert not signal['candidate_stocks']
          assert not signal['insufficient_concepts'], 'mainboard price coverage should be adequate'
          print('SAFETY_GATE',signal['hotspot_type'],signal['classification_reason'],flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mainboard-concept-source-stability-20261026
          path: |
            /tmp/mainboard_ths_stability_20261026.json
            /tmp/one_board_catalog.json
            /tmp/mainboard_stability_shadow/2026-10-26.json
          retention-days: 14
          if-no-files-found: ignore
