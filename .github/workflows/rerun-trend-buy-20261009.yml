name: Full trend-buy formal rerun (2026-10-09 close)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/trend-buy-rerun-20261009.request"

permissions:
  contents: write

concurrency:
  group: full-trend-buy-rerun-asof-20261009
  cancel-in-progress: false

jobs:
  full-rerun-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TARGET_DATE: "2026-10-09"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify frozen upstream industry and company data for Oct 9
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          target=os.environ['TARGET_DATE']
          upstream=json.loads(Path('research/trend_handoff.json').read_text())
          idx=json.loads(Path('data/low_risk/index.json').read_text())
          evidence=json.loads(Path('research/trend_buy_evidence_2026-10-09.json').read_text())
          assert upstream['trade_date']==idx['trade_date']==evidence['as_of_date']==target
          assert idx['validation']['status']=='passed'
          assert all(x['mapping_status']=='resolved' for x in upstream['signals'])
          print('FROZEN_UPSTREAM_OK',target,'sector_count',len(upstream['signals']))
          PY

      - name: Rebuild all current-date OHLCV technical structures from source history
        run: python scripts/build_full_market_price_structure.py

      - name: Independently reconstruct company working sets and complete screened research
        run: |
          python scripts/build_trend_buy_manual_research.py \
            --evidence research/trend_buy_evidence_2026-10-09.json \
            --output /tmp/full-rerun-frozen-research.json

      - name: Recompute all 42 company classifications and conditional early focus
        run: |
          python scripts/trend_buy_engine.py \
            --research /tmp/full-rerun-frozen-research.json \
            --structure data/research/full_market_price_structure.json \
            --output /tmp/full-rerun-result.json

      - name: Validate brand-new run and write formal result
        shell: bash
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          target=os.environ['TARGET_DATE']
          research=json.loads(Path('/tmp/full-rerun-frozen-research.json').read_text())
          structure=json.loads(Path('data/research/full_market_price_structure.json').read_text())
          result=json.loads(Path('/tmp/full-rerun-result.json').read_text())
          upstream=json.loads(Path('research/trend_handoff.json').read_text())
          evidence=json.loads(Path('research/trend_buy_evidence_2026-10-09.json').read_text())
          assert research['trade_date']==structure['reference_trade_date']==result['trade_date']==target
          assert structure['contract_id']=='a-share-low-risk-price-structure'
          assert research['selected_company_count']==result['coverage']['judged']
          assert result['schema_version']=='trend_buy_result_v2' and result['status']=='COMPLETE'
          assert result['mode']=='FORMAL' and result['production_eligible'] is True
          assert result['coverage']['complete'] and sum(result['summary'].values())==result['coverage']['judged']
          required=('fresh_company_research','working_set_frozen','pre_screen_coverage','company_research_coverage','structure_same_day','no_future_evidence','json_schema_valid')
          assert all(result['publication_audit'].get(k) is True for k in required)
          assert research['screen_audit']['freeze_state']=='FROZEN_NO_POSTFREEZE_MATERIALIZED_READS'
          assert research['screen_audit']['universe']==78
          assert research['selected_company_count']==42
          assert len(evidence['reviews'])>=42
          assert all(x['data_date']==target for x in result['ready']+result['wait'])
          assert all(x['status']=='READY' and x['market_state']=='趋势确认' for x in result['ready'])
          assert all(x['status']=='WAIT' for x in result['wait'])
          assert len({x['code'] for x in result['ready']+result['wait']})==len(result['ready'])+len(result['wait'])
          sectors={x['trend_name'] for x in upstream['signals']}
          if result['summary']['ready']==0:
              assert {x['trend_name'] for x in result['focus_watchlist']}==sectors
              assert len(result['focus_watchlist'])==len(sectors)
              assert all(x['status'] in ('EARLY_FOCUS_NOT_READY','NO_QUALIFIED_WAIT') for x in result['focus_watchlist'])
              assert all(x.get('not_buy_order') is True for x in result['focus_watchlist'] if x['status']=='EARLY_FOCUS_NOT_READY')
          else:
              assert result['focus_watchlist']==[]
          result['run_id']='trend-buy-full-rerun-'+os.environ['GITHUB_RUN_ID']+'-asof-'+target
          def source_sha(path):
              return subprocess.check_output(['git','rev-parse','HEAD:'+path],text=True).strip()
          result['full_rerun_provenance']={
              'kind':'fresh_pipeline_not_previous_formal_result',
              'source_trade_date':target,
              'industry_handoff_blob':source_sha('research/trend_handoff.json'),
              'company_index_blob':source_sha('data/low_risk/index.json'),
              'company_evidence_blob':source_sha('research/trend_buy_evidence_2026-10-09.json'),
              'engine_blob':source_sha('scripts/trend_buy_engine.py'),
              'research_builder_blob':source_sha('scripts/build_trend_buy_manual_research.py'),
              'fresh_price_structure_generated_at':structure['generated_at'],
              'github_actions_run_id':os.environ['GITHUB_RUN_ID']
          }
          out=Path('research/trend_buy_formal_result.json')
          encoded=json.dumps(result,ensure_ascii=False,indent=2)+'\n'
          assert json.loads(encoded)==result
          out.write_text(encoded,encoding='utf-8')
          print('FRESH_FULL_RERUN_AUDIT_PASSED',json.dumps({'run_id':result['run_id'],'date':target,'coverage':result['coverage'],'summary':result['summary'],'focus':result['focus_watchlist']},ensure_ascii=False))
          PY

      - name: Persist formal result, fetch GitHub and verify exact readback
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/trend_buy_formal_result.json
          git commit -m "research: full independent trend-buy rerun for 2026-10-09 close"
          git push origin HEAD:main
          git fetch origin main
          git show origin/main:research/trend_buy_formal_result.json | cmp - research/trend_buy_formal_result.json
          test "$(git rev-parse origin/main:research/trend_buy_formal_result.json)" = "$(git hash-object research/trend_buy_formal_result.json)"
          echo "FORMAL_PERSISTED_READBACK $(git rev-parse HEAD) $(git rev-parse origin/main:research/trend_buy_formal_result.json)"

      - name: Project full READY and WAIT handoff from the newly persisted formal SHA
        shell: bash
        run: |
          set -euo pipefail
          FORMAL_SHA="$(git rev-parse origin/main:research/trend_buy_formal_result.json)"
          python scripts/trend_buy_handoff.py \
            --result research/trend_buy_formal_result.json \
            --result-blob-sha "$FORMAL_SHA" \
            --output research/trend_buy_handoff.json
          python - <<'PY'
          import json
          from pathlib import Path
          f=json.loads(Path('research/trend_buy_formal_result.json').read_text())
          h=json.loads(Path('research/trend_buy_handoff.json').read_text())
          assert h['trade_date']==f['trade_date']
          assert h['source_run_id']==f['run_id']
          assert h['status']=='COMPLETE' and not h['shadow']
          assert len(h['items'])==len(f['ready'])+len(f['wait'])
          assert [x['code'] for x in h['items']]==[x['code'] for x in f['ready']+f['wait']]
          print('HANDOFF_SCHEMA_AND_SOURCE_VALIDATED')
          PY

      - name: Persist handoff and read back both files from GitHub main
        shell: bash
        run: |
          set -euo pipefail
          git add research/trend_buy_handoff.json
          git commit -m "research: handoff for freshly recomputed 2026-10-09 trend-buy"
          git push origin HEAD:main
          git fetch origin main
          for p in research/trend_buy_formal_result.json research/trend_buy_handoff.json; do
            git show "origin/main:$p" | cmp - "$p"
          done
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          f=json.loads(Path('research/trend_buy_formal_result.json').read_text())
          h=json.loads(Path('research/trend_buy_handoff.json').read_text())
          sha=subprocess.check_output(['git','rev-parse','origin/main:research/trend_buy_formal_result.json'],text=True).strip()
          assert h['source_formal_blob_sha']==sha
          print('FULL_FORMAL_PERSISTED_READBACK',json.dumps({
              'trade_date':f['trade_date'],
              'run_id':f['run_id'],
              'formal_blob_sha':sha,
              'handoff_blob_sha':subprocess.check_output(['git','rev-parse','origin/main:research/trend_buy_handoff.json'],text=True).strip(),
              'summary':f['summary'],
              'full_ready_count':len(f['ready']),
              'full_wait_count':len(f['wait']),
              'focus_watchlist':f['focus_watchlist']
          },ensure_ascii=False))
          PY
