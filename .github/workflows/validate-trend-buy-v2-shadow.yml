name: Trend-buy V2 relative-entry shadow

on:
  pull_request:
    paths:
      - 'experiments/trend_buy_v2_relative_entry_shadow.py'
      - 'tests/test_trend_buy_v2_relative_entry_shadow.py'
      - 'experiments/trend_buy_v2_historical_replay.py'
      - 'tests/test_trend_buy_v2_historical_replay.py'
      - 'experiments/trend_buy_v2_secondary_entries_shadow.py'
      - 'tests/test_trend_buy_v2_secondary_entries_shadow.py'
      - 'experiments/trend_buy_v2_gold_root_cause_audit.py'
      - 'research/shadow/TREND_BUY_V2_RELATIVE_ENTRY_2026-11-05.md'
      - '.github/workflows/validate-trend-buy-v2-shadow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests for relative rank, no fabricated R and no future pivots
        run: python -m unittest discover -s tests -p 'test_trend_buy_v2_relative_entry_shadow.py' -v
      - name: Generate shadow without touching formal files
        run: |
          BEFORE=$(sha256sum research/trend_buy_formal_result.json research/trend_buy_handoff.json)
          python experiments/trend_buy_v2_relative_entry_shadow.py --output /tmp/trend-buy-v2-shadow.json
          test -s /tmp/trend-buy-v2-shadow.json
          python - <<'PY'
          import json
          from pathlib import Path
          shadow=json.loads(Path('/tmp/trend-buy-v2-shadow.json').read_text())
          formal=json.loads(Path('research/trend_buy_formal_result.json').read_text())
          assert shadow['mode']=='SHADOW_ONLY_NO_FORMAL_PUBLICATION'
          assert shadow['trade_date']==formal['trade_date']
          for group in shadow['groups']:
              baseline=next(x for x in formal['top5_by_theme'] if x['trend_name']==group['trend_name'])
              assert {x['code'] for x in group['items']}=={x['code'] for x in baseline['items']}
              assert all(x['risk_reward_R'] is None or x['space_basis']=='CONFIRMED_ENTRY_STOP_AND_HISTORICAL_RESISTANCE' for x in group['items'])
          print('V2_SHADOW_GROUPS',len(shadow['groups']))
          for g in shadow['groups']:
              print('V2_SHADOW_RANK',g['trend_name'],[x['company_name'] for x in g['items']])
          PY
          AFTER=$(sha256sum research/trend_buy_formal_result.json research/trend_buy_handoff.json)
          test "$BEFORE" = "$AFTER"
      - name: Recompute 3 plus 2 shadow coverage from same-day frozen hard-eligible universe
        run: |
          python scripts/build_trend_buy_manual_research.py \
            --evidence research/trend_buy_company_reviews/latest.json \
            --output /tmp/v2-frozen-screen.json
          python experiments/trend_buy_v2_relative_entry_shadow.py \
            --frozen-screen /tmp/v2-frozen-screen.json \
            --output /tmp/trend-buy-v2-frozen-shadow.json
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('/tmp/trend-buy-v2-frozen-shadow.json').read_text())
          screen=json.loads(Path('/tmp/v2-frozen-screen.json').read_text())
          assert result['candidate_pre_screen_not_recomputed'] is False
          assert len(result['dual_channel_pre_screen'])>0
          assert screen['screen_audit']['hard_eligible']>=screen['selected_company_count']
          for x in result['dual_channel_pre_screen']:
              picks=x['shadow_candidates']
              assert len(picks)<=6
              assert len({p['code'] for p in picks})==len(picks)
          for group in result['groups']:
              print('V2_FROZEN_RANK',group['trend_name'],
                    [x['company_name'] for x in group['items']])
          print('V2_FROZEN_PRE_SCREEN',json.dumps([
              {'industry':g['industry_code'],
               'old':g['baseline_candidates'],
               'new':[x['code'] for x in g['shadow_candidates']],
               'new_reviews_required':g['new_review_required']}
              for g in result['dual_channel_pre_screen']],ensure_ascii=False))
          PY
      - name: Historical point-in-time replay; NEVER use outcome bars for selection
        run: |
          python -m unittest discover -s tests -p 'test_trend_buy_v2_historical_replay.py' -v
          python experiments/trend_buy_v2_historical_replay.py \
            --min-date 2026-10-09 --max-date 2026-11-04 \
            --output /tmp/v2-historical-shadow.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('/tmp/v2-historical-shadow.json').read_text())
          assert report['mode']=='HISTORICAL_SHADOW_INDICATIVE_NOT_TRADING_BACKTEST'
          assert report['published_snapshots']>0
          assert report['enough_independent_evidence_for_production_upgrade'] is False or all(
              x.get('distinct_dates',0)>=20 for x in report['summary'] if x['cohorts'])
          print('V2_REPLAY_SNAPSHOTS',report['published_snapshots'])
          print('V2_REPLAY_SUMMARY',json.dumps(report['summary'],ensure_ascii=False))
          print('V2_REPLAY_EXCLUSIONS',json.dumps(report['skipped'],ensure_ascii=False))
          print('V2_REPLAY_CAN_PROMOTE',report['enough_independent_evidence_for_production_upgrade'])
          winners={}
          for row in report['samples']:
              if row['horizon']!=5: continue
              d=row['v2_top1_return_pct']-row['old_top1_return_pct']
              winners.setdefault(row['theme'],[]).append(d)
          print('V2_REPLAY_BY_THEME_H5',json.dumps({
              k:{'cohorts':len(v),'mean_diff_pp':round(sum(v)/len(v),3)}
              for k,v in sorted(winners.items())},ensure_ascii=False))
          loss=sorted((x for x in report['samples'] if x['horizon']==5),
                      key=lambda x:x['v2_top1_return_pct']-x['old_top1_return_pct'])
          print('V2_REPLAY_WORST_H5',json.dumps([{
              'date':x['asof'],'theme':x['theme'],
              'original':x['old_top1'],'v2':x['v2_top1'],
              'diff_pp':round(x['v2_top1_return_pct']-x['old_top1_return_pct'],3),
              'published':x['published_at'],'fundamental_source':x['fundamentals']
          } for x in loss[:8]],ensure_ascii=False))
          PY
      - name: Upload isolated historical research report
        uses: actions/upload-artifact@v4
        with:
          name: v2-relative-entry-historical-shadow
          path: /tmp/v2-historical-shadow.json
          retention-days: 14
      - name: Validate secondary entry shapes only with completed as-of K lines
        run: |
          python -m unittest discover -s tests -p 'test_trend_buy_v2_secondary_entries_shadow.py' -v
          python experiments/trend_buy_v2_secondary_entries_shadow.py \
            --output /tmp/v2-secondary-entry-shadow.json
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('/tmp/v2-secondary-entry-shadow.json').read_text())
          assert result['mode']=='SECONDARY_ENTRY_SHAPES_SHADOW_ONLY'
          assert all(x['signal']['trade_invalidation_price'] is None for x in result['items'])
          assert all(x['signal']['trade_R'] is None for x in result['items'])
          print('V2_SECONDARY_ENTRY_COUNT',len(result['items']))
          print('V2_SECONDARY_PASSING',json.dumps([
             {'stock':x['name'],'code':x['code'],
              'follow':x['signal']['trend_follow'],
              'consolidation':x['signal']['consolidation_rebreak']}
             for x in result['items']
             if x['signal']['trend_follow'] or x['signal']['consolidation_rebreak']],
             ensure_ascii=False))
          print('V2_SECONDARY_ERRORS',json.dumps([
             {'code':x['code'],'error':x['signal']['error']}
             for x in result['items'] if x['signal'].get('error')],ensure_ascii=False))
          PY
      - name: Frozen entire-gold-industry candidate root-cause audit
        run: |
          python experiments/trend_buy_v2_gold_root_cause_audit.py \
            --date 2026-11-05 \
            --output /tmp/v2-gold-root-cause-shadow.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('/tmp/v2-gold-root-cause-shadow.json').read_text())
          assert report['mode']=='FROZEN_GOLD_CANDIDATE_AUDIT_NO_FORMAL_CHANGE'
          assert len(report['scanned']) == report['hard_eligible']
          print('GOLD_ROOT_CAUSE_ROWS',json.dumps(report['scanned'],ensure_ascii=False))
          PY
      - name: Upload gold root-cause audit
        uses: actions/upload-artifact@v4
        with:
          name: v2-gold-frozen-root-cause
          path: /tmp/v2-gold-root-cause-shadow.json
          retention-days: 14
