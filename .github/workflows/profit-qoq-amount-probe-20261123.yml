name: Probe real quarterly profit amounts 2026-11-23 (read-only)
on:
  push:
    branches: ["shadow/profit-yoy-qoq-20261123"]
    paths:
      - "experiments/profit_qoq_amount_probe_20261123.py"
      - ".github/workflows/profit-qoq-amount-probe-20261123.yml"
permissions:
  contents: read
jobs:
  qoq-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup HTTPS source client
        run: python -m pip install requests
      - name: Read as-of Q1 Q2 Q3 amounts and compute real Q/Q
        run: |
          python experiments/profit_qoq_amount_probe_20261123.py --output /tmp/real_profit_qoq_20261123.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/real_profit_qoq_20261123.json')
          x=json.loads(p.read_text())
          assert x["mode"]=="READ_ONLY_REAL_QOQ_PROBE"
          assert x["codes"]==38
          assert x["all_asof"] is True
          assert not x["q3_frozen_mismatches"]
          print("QOQ_SOURCE_PROVENANCE_OK", x["status_counts"])
          PY
      - name: Git working tree must remain unchanged
        run: git diff --exit-code && git diff --cached --exit-code
      - name: Upload read-only source-probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-qoq-profit-source-20261123
          path: /tmp/real_profit_qoq_20261123.json
          if-no-files-found: ignore
          retention-days: 35
