name: Independent trend validation archive and metrics

on:
  # The final formal buy handoff is the downstream publication boundary.
  # Does not alter or depend on the production writer.
  push:
    branches: [main]
    paths:
      - "research/trend_buy_handoff.json"
  workflow_dispatch:
  schedule:
    # Fallback only: 20:10 Beijing, Mon-Fri. GitHub schedule may be delayed.
    - cron: "10 12 * * 1-5"

permissions:
  contents: write

concurrency:
  group: independent-validation-archive
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test validation logic without invoking research jobs
        run: python -m unittest discover -s validation -p 'test_*.py' -v
      - name: Archive today's verified formal results if available
        run: python validation/archive_signals.py
      - name: Capture completed-day prices and recompute analysis
        run: python validation/analyze.py
      - name: Verify writes are isolated to validation directory
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          changed = subprocess.check_output(
              ["git", "status", "--porcelain", "--untracked-files=all"],
              text=True
          ).splitlines()
          unsafe = [line for line in changed if not line[3:].startswith("validation/")]
          if unsafe:
              raise SystemExit("VALIDATION_OUT_OF_SCOPE_WRITE: " + repr(unsafe))
          print("VALIDATION_ISOLATION_OK", len(changed))
          PY
      - name: Commit validation data only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # No error if first run has not produced any archive/prices yet.
          git add -A -- validation/
          if git diff --cached --quiet; then
            echo "No new validation records; existing production data unchanged."
            exit 0
          fi
          git commit -m "data(validation): archive formal signals and observed outcomes"
          git pull --rebase origin main
          git push origin HEAD:main
