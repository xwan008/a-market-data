name: V4 mainline promotion admission safety

on:
  push:
    branches:
      - feat/trend-buy-v4-single-mainline-20261106
  pull_request:
    paths:
      - 'scripts/build_trend_buy_manual_research.py'
      - 'scripts/v4_*'
      - 'scripts/trend_buy_engine.py'
      - 'tests/test_v4_mainline_promotion.py'
      - '.github/workflows/validate-v4-mainline-promotion.yml'
      - '.github/workflows/run-trend-buy-formal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promotion:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic V4 admission and readback
        run: |
          python scripts/v4_prepare_research_candidates.py \
            --output /tmp/trend_buy_v4_candidates_latest.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/trend_buy_v4_candidates_latest.json').read_text())
          assert data['trade_date']=='2026-11-05'
          assert data['industry_count']==3
          assert data['selected_company_count']==15
          assert all(1<=len(g['selected_codes'])<=5 for g in data['industries'])
          for g in data['industries']:
              print('V4_MIGRATION_CANDIDATES',json.dumps(g,ensure_ascii=False))
          PY
      - name: V4 admission and model ranking unit regressions
        run: |
          python -m unittest discover -s tests -p 'test_v4_mainline_promotion.py' -v
          python -m unittest discover -s tests -p 'test_trend_buy_prescreen.py' -v
          python -m unittest discover -s tests -p 'test_trend_buy_full_pipeline.py' -v
      - name: No existing formal output changed
        run: |
          git diff --exit-code -- research/trend_buy_formal_result.json research/trend_buy_handoff.json
      - uses: actions/upload-artifact@v4
        with:
          name: v4-mainline-prospective-gate-check
          path: /tmp/trend_buy_v4_candidates_latest.json
          retention-days: 14
