name: Rebuild ChatGPT Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/runtime-trigger.txt"

permissions:
  contents: write

concurrency:
  group: rebuild-chatgpt-runtime
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure industry-state unit contract
        run: python scripts/ensure_industry_state_contract.py data/research/industry_state.json

      - name: Rebuild compact snapshot from repository data
        run: |
          python scripts/build_snapshot.py --source . --output data/snapshot.json
          python scripts/attach_market_state.py data/snapshot.json
          python scripts/normalize_snapshot_source.py data/snapshot.json
          python scripts/validate_snapshot.py data/snapshot.json

      - name: Build and validate research runtime
        run: python scripts/build_runtime.py data/snapshot.json --output-dir data/runtime

      - name: Commit rebuilt research data
        shell: bash
        run: |
          if ! git status --porcelain -- data/research/industry_state.json data/snapshot.json data/runtime | grep -q .; then
            echo "research snapshot/runtime unchanged"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/research/industry_state.json data/snapshot.json data/runtime
          git commit -m "data: rebuild ChatGPT research runtime"
          git push origin HEAD:main
