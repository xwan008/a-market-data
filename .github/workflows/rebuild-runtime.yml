name: Rebuild ChatGPT Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/runtime-trigger.txt"

permissions:
  contents: write

concurrency:
  group: rebuild-chatgpt-runtime
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build runtime from existing snapshot
        run: python scripts/split_snapshot.py data/snapshot.json --output-dir data/runtime

      - name: Validate research runtime
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          meta = json.loads(Path("data/runtime/meta.json").read_text(encoding="utf-8"))
          assert meta.get("runtime_kind") == "low_risk_research", meta.get("runtime_kind")
          validation = meta.get("runtime_validation") or {}
          assert validation.get("status") == "passed", validation
          assert meta.get("screening_count") == meta.get("source_candidate_count")
          assert meta.get("detail_count") == meta.get("screening_count")
          assert Path(meta["screening_file"]).exists()
          assert Path(meta["industry_state_file"]).exists()

          required_screening_columns = {
              "code", "name", "price", "industry_code", "industry_name",
              "market_cap", "pe_ttm", "pe_dynamic", "pb", "roe",
              "revenue_yoy", "net_profit_yoy", "deduct_basic_eps_yoy",
              "operating_cashflow_per_share", "gross_margin", "net_profit",
              "close_change_20d_pct", "position_pct", "trend_state",
              "break_state", "support_center", "resistance_center",
              "invalidation_price", "invalidation_direction",
          }
          actual_columns = set(meta.get("screening_columns") or [])
          missing = sorted(required_screening_columns - actual_columns)
          assert not missing, missing

          detail_dir = Path("data/runtime/details")
          details = list(detail_dir.glob("*.json"))
          assert len(details) == meta.get("detail_count"), (len(details), meta.get("detail_count"))

          print(json.dumps({
              "runtime_kind": meta.get("runtime_kind"),
              "trade_date": (meta.get("snapshot") or {}).get("trade_date"),
              "screening_count": meta.get("screening_count"),
              "detail_count": meta.get("detail_count"),
              "industry_count": meta.get("industry_count"),
              "validation": validation.get("status"),
          }, ensure_ascii=False))
          PY

      - name: Commit rebuilt runtime
        shell: bash
        run: |
          if ! git status --porcelain -- data/runtime | grep -q .; then
            echo "runtime unchanged"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/runtime
          git commit -m "data: rebuild ChatGPT research runtime"
          git push origin HEAD:main
