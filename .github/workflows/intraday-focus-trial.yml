name: Focus intraday integration trial
on:
  workflow_dispatch:
  push:
    branches: [test/on-demand-market-probe]
    paths: [scripts/intraday_focus_trial.py, scripts/focus_private_transport.py, scripts/on_demand_market_probe.py, tests/test_intraday_focus_trial.py, .github/workflows/intraday-focus-trial.yml]
permissions:
  contents: write
jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: focus-trial-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Deterministic fault isolation tests
        run: python3 -m unittest discover -s tests -p test_intraday_focus_trial.py -v
      - name: Real focus collection and publication contract trial
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          FOCUS_HOLDINGS_TABLE_ID: tbl6EE2lzmexvkARz
          FOCUS_OUTPUT_TABLE_ID: tblSLMquHqx5ZfmbI
          FOCUS_PRIVATE_PUBLISH: "0"
          EXPECTED_BASELINE_DATE: "2026-11-26"
        run: python3 scripts/intraday_focus_trial.py
      - name: Upload public-only test payload
        uses: actions/upload-artifact@v4
        with:
          name: focus-public-trial
          path: focus_trial_public.json
          retention-days: 1
      - name: Publish public test payload to the isolated branch
        if: github.ref == 'refs/heads/test/on-demand-market-probe'
        shell: bash
        run: |
          mkdir -p research
          cp focus_trial_public.json research/intraday_focus_trial_public.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/intraday_focus_trial_public.json
          git commit -m "test data: publish public focus trial $GITHUB_RUN_ID"
          git push origin HEAD:refs/heads/test/on-demand-market-probe
          git fetch origin refs/heads/test/on-demand-market-probe
          git show FETCH_HEAD:research/intraday_focus_trial_public.json | cmp - focus_trial_public.json
