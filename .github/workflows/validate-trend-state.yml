name: Validate A-share trend lifecycle gate

on:
  push:
    branches: [main]
    paths:
      - 'scripts/validate_trend_state_migrations.py'
      - 'skill/TREND_DISCOVERY_NEUTRAL.md'
      - 'tests/test_trend_outcome_cohort.py'
      - 'tests/test_trend_discovery_checkpoint.py'
      - 'scripts/build_trend_outcome_cohort.py'
      - 'scripts/validate_trend_discovery_checkpoint.py'
      - 'tests/test_trend_lifecycle_semantics.py'
      - 'tests/test_trend_publication_pair.py'
      - 'scripts/audit_trend_lifecycle_semantics.py'
      - 'scripts/validate_trend_publication_pair.py'
      - 'tests/test_trend_state_migrations.py'
      - 'skill/TREND_REGISTRY_PROTOCOL.md'
      - '.github/workflows/validate-trend-state.yml'
  pull_request:
    paths:
      - 'scripts/validate_trend_state_migrations.py'
      - 'skill/TREND_DISCOVERY_NEUTRAL.md'
      - 'tests/test_trend_outcome_cohort.py'
      - 'tests/test_trend_discovery_checkpoint.py'
      - 'scripts/build_trend_outcome_cohort.py'
      - 'scripts/validate_trend_discovery_checkpoint.py'
      - 'tests/test_trend_lifecycle_semantics.py'
      - 'tests/test_trend_publication_pair.py'
      - 'scripts/audit_trend_lifecycle_semantics.py'
      - 'scripts/validate_trend_publication_pair.py'
      - 'tests/test_trend_state_migrations.py'
      - 'skill/TREND_REGISTRY_PROTOCOL.md'
      - '.github/workflows/validate-trend-state.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-gate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test import dependency
        run: python -m pip install 'requests>=2.31,<3'
      - name: Run lifecycle continuity and anti-noise regression tests
        run: python -m unittest discover -s tests -p 'test_trend_*.py' -v
      - name: Validate source compiles
        run: python -m py_compile scripts/validate_trend_state_migrations.py scripts/validate_trend_publication_pair.py scripts/audit_trend_lifecycle_semantics.py scripts/validate_trend_discovery_checkpoint.py scripts/build_trend_outcome_cohort.py
      - name: Verify real V2 cutover archive and published handoff
        run: |
          python scripts/validate_trend_state_migrations.py --previous research/trend_archive/2026-10-16_v1_snapshot.json --proposed research/trend_registry.json --previous-blob-sha d98dbd238aecd50ef68256b30f0a1f8aac4e12c5 --archive research/trend_archive/2026-10-16_v1_snapshot.json
          python scripts/validate_trend_publication_pair.py --registry research/trend_registry.json --handoff research/trend_handoff.json
      - name: Smoke test latest frozen registry and handoff consistency (historical mode only)
        run: python scripts/validate_trend_publication_pair.py --registry research/trend_registry.json --handoff research/trend_handoff.json --historical-baseline-only
      - name: Audit past lifecycle classification without modifying official registry
        run: python scripts/audit_trend_lifecycle_semantics.py --registry research/trend_registry.json --registry-blob-sha legacy-snapshot
