name: One-off frozen bank fund-flow probe
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/fund-flow-probe-20261125.yml']
permissions:
  contents: read
jobs:
  probe:
    if: github.head_ref == 'test/fund-flow-probe-20261125'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Probe Baidu independent daily money flow even if Sina gate failed
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.parse,time
          from pathlib import Path
          a=json.loads(Path('research/trend_buy_candidates/latest.json').read_text())
          day=a['trade_date']
          codes=next(i['selected_codes'] for i in a['industries'] if i['industry_code']=='S480201')
          for code in codes:
              o={'code':code,'provider':'baidu'}
              try:
                  url='https://finance.pae.baidu.com/vapi/v1/fundsortlist?'+urllib.parse.urlencode({'code':code,'market':'ab','pn':0,'rn':20,'finClientType':'pc'})
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/vnd.finance-web.v1+json','Origin':'https://gushitong.baidu.com','Referer':'https://gushitong.baidu.com/'})
                  with urllib.request.urlopen(req,timeout=12) as res:
                      body=res.read().decode('utf-8','replace')
                      o['http_status']=res.status
                  obj=json.loads(body)
                  o['result_code']=obj.get('ResultCode')
                  o['result']=obj.get('Result')
                  o['body_prefix']=body[:500]
              except Exception as e:
                  o['error']=type(e).__name__+': '+str(e)
              print(json.dumps(o,ensure_ascii=False,allow_nan=False),flush=True)
              time.sleep(0.5)
          PY
