name: One-off frozen bank fund-flow probe
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths: ['.github/workflows/fund-flow-probe-20261125.yml']
permissions:
  contents: read
jobs:
  probe:
    if: github.head_ref == 'test/fund-flow-probe-20261125'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Test Tencent history selector and fresh Eastmoney retry
        run: |
          python3 - <<'PY'
          import json,urllib.parse,subprocess,concurrent.futures,time
          from pathlib import Path
          a=json.loads(Path('research/trend_buy_candidates/latest.json').read_text())
          codes=next(i['selected_codes'] for i in a['industries'] if i['industry_code']=='S480201')+['000001','300750']
          def get(task):
              kind,code,url,referer=task
              out={'kind':kind,'code':code,'url':url}
              for i in range(2):
                  try:
                      p=subprocess.run(['curl','-sS','-L','--max-time','12','-A','Mozilla/5.0','-e',referer,'-w','\nHTTP_CODE:%{http_code}',url],capture_output=True,timeout=15)
                      b,sep,status=p.stdout.rpartition(b'\nHTTP_CODE:')
                      out['http']=status.decode('ascii','replace')
                      out['exit']=p.returncode
                      if p.returncode: raise ValueError(p.stderr.decode('utf-8','replace')[:300])
                      obj=json.loads(b.decode('utf-8','replace'))
                      out['response']=obj
                      out['attempts']=i+1
                      return out
                  except Exception as e:
                      out['error']=type(e).__name__+': '+str(e)
                      if i==0: time.sleep(2)
              return out
          jobs=[]
          for code in codes:
              market='sh' if code.startswith('6') else 'sz'
              for typ in ['historyFundFlow','fiveDayFundFlow']:
                  q='https://proxy.finance.qq.com/cgi/cgi-bin/fundflow/hsfundtab?'+urllib.parse.urlencode({'code':market+code,'type':typ,'klineNeedDay':20})
                  jobs.append(('qq_'+typ,code,q,'https://gu.qq.com/'))
              q='https://push2his.eastmoney.com/api/qt/stock/fflow/daykline/get?'+urllib.parse.urlencode({'secid':('1.' if market=='sh' else '0.')+code,'fields1':'f1,f2,f3,f7','fields2':'f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61,f62,f63','lmt':20,'klt':101,'ut':'b2884a393a59ad64002292a3e90d46a5'})
              jobs.append(('em_retry',code,q,'https://data.eastmoney.com/'))
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as ex:
              for out in ex.map(get,jobs):
                  print(json.dumps(out,ensure_ascii=False,allow_nan=False),flush=True)
          PY
