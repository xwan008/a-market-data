name: One-off frozen bank fund-flow probe
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths: ['.github/workflows/fund-flow-probe-20261125.yml']
permissions:
  contents: read
jobs:
  probe:
    if: github.head_ref == 'test/fund-flow-probe-20261125'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify Tencent today date, history continuity and quote amount
        run: |
          python3 - <<'PY'
          import json,urllib.parse,subprocess,concurrent.futures,datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          a=json.loads(Path('research/trend_buy_candidates/latest.json').read_text())
          codes=next(i['selected_codes'] for i in a['industries'] if i['industry_code']=='S480201')+['000001','300750']
          def get(url,ref):
              p=subprocess.run(['curl','-sS','-L','--max-time','12','-A','Mozilla/5.0','-e',ref,'-w','\nHTTP_CODE:%{http_code}',url],capture_output=True,timeout=15)
              b,sep,status=p.stdout.rpartition(b'\nHTTP_CODE:')
              if p.returncode or status!=b'200': raise RuntimeError(p.stderr.decode('utf-8','replace')[:200]+' HTTP '+str(status))
              return b
          def test(code):
              out={'code':code,'queried_at':datetime.datetime.now(ZoneInfo('Asia/Shanghai')).isoformat()}
              m=('sh' if code.startswith('6') else 'sz')+code
              base='https://proxy.finance.qq.com/cgi/cgi-bin/fundflow/hsfundtab?'
              for typ in ['todayFundFlow','todayFundTrend','historyFundFlow','fiveDayFundFlow']:
                  try:
                      u=base+urllib.parse.urlencode({'code':m,'type':typ,'klineNeedDay':20})
                      x=json.loads(get(u,'https://gu.qq.com/'))
                      out[typ]=x
                  except Exception as e: out[typ+'_error']=str(e)
              try:
                  out['quote']=get('https://qt.gtimg.cn/q='+m,'https://gu.qq.com/').decode('gb18030','replace')
              except Exception as e: out['quote_error']=str(e)
              return out
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as ex:
              for x in ex.map(test,codes):
                  print(json.dumps(x,ensure_ascii=False,allow_nan=False),flush=True)
          PY
