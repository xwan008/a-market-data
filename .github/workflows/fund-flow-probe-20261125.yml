name: One-off frozen bank fund-flow probe
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/fund-flow-probe-20261125.yml']
permissions:
  contents: read
jobs:
  probe:
    if: github.head_ref == 'test/fund-flow-probe-20261125'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Probe Sina historical fund-flow and frozen price
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, math, time
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          def read(p): return json.loads(Path(p).read_text())
          a=read('research/trend_buy_candidates/latest.json')
          day=a['trade_date']
          assert day=='2026-11-25'
          codes=next(i['selected_codes'] for i in a['industries'] if i['industry_code']=='S480201')
          part=read('data/low_risk/by_industry/S480201/part-001.json')
          assert part['trade_date']==day
          frozen={x['code']:x for x in part['companies']}
          results=[]
          for code in codes:
              f=frozen[code]
              url='https://vip.stock.finance.sina.com.cn/quotes_service/api/json_v2.php/MoneyFlow.ssl_qsfx_zjlrqs?'+urllib.parse.urlencode({'page':1,'num':30,'sort':'opendate','asc':0,'daima':'sh'+code})
              out={'code':code,'name':f['name'],'frozen_close':f['price'],'source_url':url,'status':'FAIL'}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Referer':'https://finance.sina.com.cn/'})
                  with urllib.request.urlopen(req,timeout=15) as res:
                      raw=res.read().decode('utf-8','replace')
                      out['http_status']=res.status
                  out['body_prefix']=raw[:600]
                  rows=json.loads(raw[raw.index('['):raw.rindex(']')+1])
                  assert isinstance(rows,list) and rows,'empty history'
                  out['latest_raw_date']=max(r['opendate'] for r in rows)
                  rows=sorted([r for r in rows if r['opendate']<=day],key=lambda r:r['opendate'])[-20:]
                  out['rows']=rows
                  assert len(rows)==20 and len({r['opendate'] for r in rows})==20 and rows[-1]['opendate']==day,'missing required dates'
                  h=read('data/history_shards/'+code[:4]+'.json')['stocks'][code]['history']
                  expected=sorted({r['date'] for r in h if r['date']<=day})[-20:]
                  assert [r['opendate'] for r in rows]==expected,'historical date mismatch'
                  last=rows[-1]
                  out['provider_close']=float(last['trade'])
                  assert abs(out['provider_close']-f['price'])<0.005,'frozen close mismatch'
                  for r in rows:
                      for k in ['netamount','ratioamount','r0_net','r1_net']:
                          assert math.isfinite(float(r[k])), 'nonfinite '+k
                  out['raw_fields_verified']=True
                  out['status']='RAW_PASS'
              except Exception as e:
                  out['error']=type(e).__name__+': '+str(e)
              out['queried_at']=datetime.now(ZoneInfo('Asia/Shanghai')).isoformat()
              print(json.dumps(out,ensure_ascii=False,allow_nan=False),flush=True)
              results.append(out)
              time.sleep(1)
          n=sum(x['status']=='RAW_PASS' for x in results)
          print('RAW_GROUP_RESULT',n,'/',len(codes),flush=True)
          assert n==len(codes),'raw response probe failed'
          PY
