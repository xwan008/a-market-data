name: One-off frozen bank fund-flow probe
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths: ['.github/workflows/fund-flow-probe-20261125.yml']
permissions:
  contents: read
jobs:
  probe:
    if: github.head_ref == 'test/fund-flow-probe-20261125'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Probe Tencent and alternate Eastmoney routes plus THS and Stockstar public pages
        run: |
          python3 - <<'PY'
          import json, urllib.parse, subprocess, re, concurrent.futures
          from pathlib import Path
          a=json.loads(Path('research/trend_buy_candidates/latest.json').read_text())
          day=a['trade_date']
          codes=next(i['selected_codes'] for i in a['industries'] if i['industry_code']=='S480201')
          def probe(task):
              kind,code,url,ref=task
              out={'kind':kind,'code':code,'url':url}
              try:
                  p=subprocess.run(['curl','-sS','-L','--max-time','15','-A','Mozilla/5.0','-e',ref,'-w','\nHTTP_CODE:%{http_code}',url],capture_output=True,timeout=18)
                  body,sep,status=p.stdout.rpartition(b'\nHTTP_CODE:')
                  out['http']=status.decode('ascii','replace')
                  out['curl_exit']=p.returncode
                  if p.returncode: out['error']=p.stderr.decode('utf-8','replace')[:300]
                  raw=body.decode('utf-8','replace')
                  if kind.startswith('qq') or kind.startswith('em'):
                      if kind=='qq_legacy':
                          out['body']=body.decode('gb18030','replace')[:4000]
                      else:
                          x=json.loads(raw)
                          out['response']=x
                  else:
                      out['length']=len(raw)
                      out['title']=re.findall(r'<title[^>]*>(.*?)</title>',raw,re.S)[:1]
                      out['date_hits']=list(dict.fromkeys(re.findall(r'20\d\d[-/]\d\d[-/]\d\d',raw)))[:25]
                      out['text_hits']=[]
                      for m in list(re.finditer(r'主力净流入|净流入|历史资金|资金流向|2026-11-25',raw))[:12]:
                          out['text_hits'].append(re.sub(r'<[^>]*>',' ',raw[max(0,m.start()-80):m.end()+180]))
              except Exception as e:
                  out['error']=type(e).__name__+': '+str(e)
              return out
          jobs=[]
          for code in codes:
              q='https://proxy.finance.qq.com/cgi/cgi-bin/fundflow/hsfundtab?'+urllib.parse.urlencode({'code':'sh'+code,'type':'todayFundFlow','klineNeedDay':20})
              jobs.append(('qq_fund',code,q,'https://gu.qq.com/'))
              q='https://qt.gtimg.cn/q=ff_sh'+code
              jobs.append(('qq_legacy',code,q,'https://gu.qq.com/'))
              for host in ['push2his.eastmoney.com']:
                  q='https://'+host+'/api/qt/stock/fflow/daykline/get?'+urllib.parse.urlencode({'secid':'1.'+code,'fields1':'f1,f2,f3,f7','fields2':'f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61,f62,f63','lmt':20,'klt':101,'ut':'b2884a393a59ad64002292a3e90d46a5'})
                  jobs.append(('em_daykline',code,q,'https://data.eastmoney.com/'))
              jobs.append(('ths_stockpage',code,'https://stockpage.10jqka.com.cn/'+code+'/index/','https://stockpage.10jqka.com.cn/'))
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:
              for out in ex.map(probe,jobs):
                  print(json.dumps(out,ensure_ascii=False,allow_nan=False),flush=True)
          PY
