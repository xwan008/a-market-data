name: Migrate Legacy Data Once

on:
  push:
    paths:
      - '.github/workflows/migrate-upstream-data.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: migrate-v2-source-data
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout V2 repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout legacy repository
        uses: actions/checkout@v4
        with:
          repository: xwan008/a-share-market-data
          ref: main
          path: legacy
          fetch-depth: 1
          sparse-checkout: |
            data/history_shards
            data/shards
            data/latest.json
            data/trend_summary.json
            data/repair_status.json
            data/research/industry_state.json
            data/research/company_industry_index.json
            scripts/fetch_market.py
            scripts/fetch_market_resilient.py
            scripts/validate.py
            scripts/history_store.py
            scripts/build_history.py
            scripts/build_bridge.py
            scripts/enrich_shards_with_industry.py
            scripts/build_full_market_price_structure.py
            scripts/repair_corporate_actions.py
            requirements.txt
          sparse-checkout-cone-mode: false

      - name: Copy source data and updater code
        shell: bash
        run: |
          mkdir -p data/history_shards data/shards data/research scripts
          rm -rf data/history_shards data/shards
          cp -R legacy/data/history_shards data/history_shards
          cp -R legacy/data/shards data/shards
          cp legacy/data/latest.json data/latest.json
          cp legacy/data/trend_summary.json data/trend_summary.json
          cp legacy/data/repair_status.json data/repair_status.json
          cp legacy/data/research/industry_state.json data/research/industry_state.json
          cp legacy/data/research/company_industry_index.json data/research/company_industry_index.json
          cp legacy/scripts/fetch_market.py scripts/fetch_market.py
          cp legacy/scripts/fetch_market_resilient.py scripts/fetch_market_resilient.py
          cp legacy/scripts/validate.py scripts/validate.py
          cp legacy/scripts/history_store.py scripts/history_store.py
          cp legacy/scripts/build_history.py scripts/build_history.py
          cp legacy/scripts/build_bridge.py scripts/build_bridge.py
          cp legacy/scripts/enrich_shards_with_industry.py scripts/enrich_shards_with_industry.py
          cp legacy/scripts/build_full_market_price_structure.py scripts/build_full_market_price_structure.py
          cp legacy/scripts/repair_corporate_actions.py scripts/repair_corporate_actions.py
          cp legacy/requirements.txt requirements.txt

      - name: Commit migrated source data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data scripts requirements.txt
          if git diff --cached --quiet; then
            echo "nothing to migrate"
            exit 0
          fi
          git commit -m "data: migrate V2 source dataset"
          git push
