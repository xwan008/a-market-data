name: Validate A-share trend-buy canonical

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/trend_buy_engine.py'
      - 'scripts/trend_buy_handoff.py'
      - 'scripts/build_intraday_snapshot.py'
      - 'tests/test_trend_buy_handoff.py'
      - 'tests/test_trend_buy_snapshot_bridge.py'
      - 'tests/test_trend_buy_full_pipeline.py'
      - 'skill/INTRADAY_MONITOR_CANONICAL.md'
      - '.github/workflows/update-intraday-snapshot.yml'
      - 'research/trend_buy_company_review_current.json'
      - 'scripts/build_full_market_price_structure.py'
      - 'tests/test_trend_buy_engine.py'
      - 'tests/test_trend_buy_entry_focus.py'
      - 'tests/test_trend_buy_dynamic_top5.py'
      - 'tests/test_trend_buy_prescreen.py'
      - 'scripts/build_trend_buy_manual_research.py'
      - 'skill/PRE_SCREEN_RESEARCH_SCOPE_OVERRIDE.md'
      - 'skill/TREND_BUY_CANONICAL.md'
      - '.github/workflows/validate-trend-buy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-trend-buy:
    name: Mainline trend-buy production gates and regression
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal snapshot bridge dependencies
        run: python -m pip install 'requests>=2.31,<3'
      - name: Test technical entry and no stale/future leakage
        run: |
          python -m unittest discover -s tests -p 'test_trend_buy_engine.py' -v
          python -m unittest discover -s tests -p 'test_trend_buy_entry_focus.py' -v
          python -m unittest discover -s tests -p 'test_trend_buy_dynamic_top5.py' -v
          python -m unittest discover -s tests -p 'test_trend_buy_prescreen.py' -v
          python -m unittest discover -s tests -p 'test_trend_buy_handoff.py' -v
          python -m unittest discover -s tests -p 'test_trend_buy_snapshot_bridge.py' -v
          python -m unittest discover -s tests -p 'test_trend_buy_full_pipeline.py' -v
      - name: Rebuild compact price structures for frozen completed session
        run: python scripts/build_full_market_price_structure.py
      - name: Fresh company screening from frozen market inputs only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          handoff=json.loads(Path('research/trend_handoff.json').read_text(encoding='utf-8'))
          index=json.loads(Path('data/low_risk/index.json').read_text(encoding='utf-8'))
          assert index['trade_date']==handoff['trade_date']
          assert index['validation']['status']=='passed'
          day=handoff['trade_date']
          Path('/tmp/fresh-company-evidence.json').write_text(json.dumps({
            'as_of_date':day,'reviews':[],'origin':'empty_new_run_no_prior_research'
          }),encoding='utf-8')
          print('FRESH_SOURCE_DATE',day)
          PY
          python scripts/build_trend_buy_manual_research.py --evidence /tmp/fresh-company-evidence.json --output /tmp/fresh-company-screen.json
          python - <<'PY'
          import json
          from pathlib import Path
          o=json.loads(Path('/tmp/fresh-company-screen.json').read_text())
          a=o['screen_audit']
          assert o['mode']=='SHADOW' and o['publication_audit']['company_research_coverage'] is False
          assert a['source_review_pending_count']==o['selected_company_count']
          print('FRESH_SCREEN_AUDIT',json.dumps({
            'date':o['trade_date'],'universe':a['universe'],
            'hard_eligible':a['hard_eligible'],'selected':o['selected_company_count'],
            'research_slots_per_industry':a['research_slots_per_industry']
          },ensure_ascii=False))
          print('FRESH_SCREEN_CANDIDATES',json.dumps([
            {'code':c['code'],'name':c['company_name'],
             'theme':c['trend_name'],'industry':c['industry_code'],
             'prescreen':next((x['combined_score'] for x in a['pre_screen_selected']
                               if x['code']==c['code']),None)}
            for c in o['companies']
          ],ensure_ascii=False))
          PY
      - name: Validate current fresh company research and dynamic Top5
        run: |
          python scripts/build_trend_buy_manual_research.py --evidence research/trend_buy_company_review_current.json --output /tmp/current_research.json
          python scripts/trend_buy_engine.py --research /tmp/current_research.json --structure data/research/full_market_price_structure.json --output /tmp/current_result.json
          python - <<'PY'
          import json
          from pathlib import Path
          load=lambda p:json.loads(Path(p).read_text(encoding='utf-8'))
          research=load('/tmp/current_research.json')
          result=load('/tmp/current_result.json')
          audit=research['screen_audit']
          review=load('research/trend_buy_company_review_current.json')
          assert audit['hard_eligible']==len(audit['lightweight_scanned'])
          assert audit['hard_eligible']==len(audit['pre_screen_selected'])+len(audit['pre_screened_out'])
          assert audit['research_scope']=='dynamic_tertiary_industry_top5_after_lightweight_scan'
          assert result['coverage']['judged']==len(audit['pre_screen_selected'])
          assert all(0<=v<=6 for v in audit['research_slots_per_industry'].values())
          assert audit['source_review_pending_count']==0
          assert {x['code'] for x in research['companies']}=={x['code'] for x in review['reviews']}
          assert research['mode']==result['mode']=='FORMAL'
          assert result['status']=='COMPLETE' and result['production_eligible'] is True
          assert sum(result['summary'].values())==result['coverage']['judged']
          assert all(len(g['items'])<=5 for g in result['top5_by_theme'])
          assert all(x['trend_phase']!='COOLING' for g in result['top5_by_theme'] for x in g['items'])
          assert all(result['publication_audit'].values())
          print('MAINLINE_CURRENT_RESEARCH_AUDIT',json.dumps({
            'trade_date':result['trade_date'],'scanned':audit['hard_eligible'],
            'researched':result['coverage']['judged'],'summary':result['summary'],
            'top5':{g['trend_name']:[x['code'] for x in g['items']] for g in result['top5_by_theme']}
          },ensure_ascii=False))
          PY
      - name: Verify exact current dynamic-theme handoff contract
        run: |
          python scripts/trend_buy_handoff.py --result /tmp/current_result.json --result-blob-sha ci-contract-only --output /tmp/trend_buy_handoff.json
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from trend_buy_handoff import validate_items
          formal=json.loads(Path('/tmp/current_result.json').read_text())
          handoff=json.loads(Path('/tmp/trend_buy_handoff.json').read_text())
          codes=[x['code'] for g in formal['top5_by_theme'] for x in g['items']]
          assert handoff['shadow'] is False
          assert [x['code'] for x in handoff['items']]==codes
          assert len(validate_items(handoff))==len(codes)
          print('CURRENT_MAINLINE_HANDOFF_CONTRACT',len(codes))
          PY
      - name: Check persisted formal SHA and monitor compatibility
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import build_intraday_snapshot as snapshot
          import trend_buy_handoff
          h,items,kind=snapshot.active_stock_handoff()
          assert kind=='trend_buy_v2'
          assert all(x['wait_reason'] in trend_buy_handoff.WAIT_REASONS
                     for x in items if x['status']=='WAIT')
          assert len(items)==len(json.loads(Path('research/trend_buy_handoff.json').read_text())['items'])
          print('PERSISTED_MAINLINE_HANDOFF_VALID',len(items))
          PY
      - name: Syntax check trend-buy modules
        run: python -m py_compile scripts/build_full_market_price_structure.py scripts/build_trend_buy_manual_research.py scripts/trend_buy_engine.py scripts/trend_buy_handoff.py scripts/build_intraday_snapshot.py
