name: Update Intraday Market Snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "automation/external-trigger-intraday.txt"

permissions:
  contents: write

concurrency:
  group: update-intraday-market-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Check scheduled snapshot freshness
        id: freshness
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          path = Path("research/intraday_market_snapshot.json")
          skip = False
          reason = "snapshot missing"

          if path.exists():
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
                  now = datetime.now(ZoneInfo("Asia/Shanghai"))
                  captured_raw = payload.get("captured_at")
                  captured = datetime.fromisoformat(captured_raw) if captured_raw else None
                  if captured and captured.tzinfo is None:
                      captured = captured.replace(tzinfo=ZoneInfo("Asia/Shanghai"))

                  validation = payload.get("validation") or {}
                  handoff = json.loads(Path("research/low_risk_handoff.json").read_text(encoding="utf-8"))
                  handoff_items = handoff.get("items") or []
                  stocks = payload.get("low_risk_stocks") or {}
                  expected = {str(item.get("code") or "").zfill(6): item for item in handoff_items}
                  handoff_matches = (
                      handoff.get("status") == "COMPLETE"
                      and isinstance(handoff.get("items"), list)
                      and len(expected) == len(handoff_items)
                      and set(stocks) == set(expected)
                      and payload.get("source_low_risk_handoff_run_id") == handoff.get("source_run_id")
                      and payload.get("source_low_risk_handoff_schema_version") == handoff.get("schema_version")
                      and validation.get("low_risk_stock_coverage_passed") is True
                      and all(
                          stocks[code].get("formal_status") == item.get("status")
                          and stocks[code].get("wait_reason") == item.get("wait_reason")
                          for code, item in expected.items()
                      )
                  )
                  age_seconds = (now - captured).total_seconds() if captured else None

                  fresh = (
                      payload.get("trade_date") == now.date().isoformat()
                      and age_seconds is not None
                      and 0 <= age_seconds <= 8 * 60
                      and validation.get("status") == "passed"
                      and handoff_matches
                      and validation.get("quote_coverage", 0) >= 0.90
                      and not validation.get("manifest_errors")
                  )

                  if fresh:
                      skip = True
                      reason = f"snapshot already fresh: captured_at={captured_raw}, age_seconds={age_seconds:.0f}"
                  else:
                      reason = f"snapshot stale or invalid: captured_at={captured_raw}, age_seconds={age_seconds}"
              except Exception as exc:
                  reason = f"freshness check failed, refresh required: {exc}"

          print(reason)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"skip={'true' if skip else 'false'}\n")
          PY

      - name: Setup Python
        if: steps.freshness.outputs.skip != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.freshness.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Test low-risk handoff contract
        if: steps.freshness.outputs.skip != 'true'
        run: python -m unittest discover -s tests -p 'test_low_risk_handoff_contract.py'

      - name: Test cross-day continuity
        if: steps.freshness.outputs.skip != 'true'
        run: python -m unittest discover -s tests -p "test_intraday_crossday.py"

      - name: Build intraday snapshot
        if: steps.freshness.outputs.skip != 'true'
        run: python scripts/build_intraday_snapshot.py

      - name: Validate snapshot
        if: steps.freshness.outputs.skip != 'true'
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          path = Path("research/intraday_market_snapshot.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          today = datetime.now(ZoneInfo("Asia/Shanghai")).date().isoformat()

          assert payload.get("result_kind") == "a_share_intraday_market_snapshot"
          assert payload.get("trade_date") == today
          validation = payload.get("validation") or {}
          assert validation.get("status") == "passed"
          assert validation.get("source_handoff_dates_present") is True
          assert validation.get("source_handoff_trade_date_consistent") is True
          assert validation.get("formal_prev_close_alignment_passed") is True
          assert validation.get("low_risk_stock_coverage_passed") is True
          handoff = json.loads(Path("research/low_risk_handoff.json").read_text(encoding="utf-8"))
          assert handoff.get("status") == "COMPLETE"
          items = handoff.get("items")
          assert isinstance(items, list)
          expected = {str(item.get("code") or "").zfill(6): item for item in items}
          assert len(expected) == len(items), "duplicate low-risk handoff codes"
          stocks = payload.get("low_risk_stocks")
          assert isinstance(stocks, dict)
          assert set(stocks) == set(expected), "low-risk handoff stocks lost in snapshot"
          assert validation.get("low_risk_handoff_item_count") == len(items)
          assert validation.get("low_risk_stock_count") == len(stocks)
          assert payload.get("source_low_risk_handoff_run_id") == handoff.get("source_run_id")
          assert payload.get("source_low_risk_handoff_schema_version") == handoff.get("schema_version")
          valid_reasons = {"WAIT_PRICE", "WAIT_MARGIN", "WAIT_EXPECTATION", "WAIT_CATALYST"}
          for code, item in expected.items():
              assert item.get("status") in {"READY", "WAIT"}
              if item.get("status") == "WAIT":
                  assert item.get("wait_reason") in valid_reasons
              else:
                  assert item.get("wait_reason") is None
              assert stocks[code].get("formal_status") == item.get("status")
              assert stocks[code].get("wait_reason") == item.get("wait_reason")
          assert validation.get("quote_coverage", 0) >= 0.90
          assert not validation.get("manifest_errors")
          assert payload.get("trends")
          assert payload.get("industries")
          assert validation.get("board_history_target_count") in (0, len(payload["trends"]))
          if validation.get("board_history_target_count") == 0:
              assert validation.get("crossday_history_errors"), "unexpectedly missing board history"
          assert "board_history_20d_available_count" not in validation
          for trend in payload["trends"].values():
              assert trend.get("history_context_status") in {"available", "partial", "unavailable"}
              context = trend.get("history_context")
              if context is not None:
                  assert context.get("baseline_trade_date") == handoff.get("trade_date")
                  assert "five_day" in context and context["five_day"]["window_sessions"] == 5
                  assert "twenty_day" not in context
          print(json.dumps({
              "trade_date": payload.get("trade_date"),
              "captured_at": payload.get("captured_at"),
              "quote_coverage": validation.get("quote_coverage"),
              "trends": len(payload.get("trends") or {}),
              "industries": len(payload.get("industries") or {}),
              "low_risk_stocks": len(payload.get("low_risk_stocks") or {}),
          }, ensure_ascii=False))
          PY

      - name: Commit intraday snapshot only
        if: steps.freshness.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add research/intraday_market_snapshot.json research/intraday_crossday_archive.json

          if git diff --cached --quiet -- research/intraday_market_snapshot.json research/intraday_crossday_archive.json; then
            echo "intraday snapshot unchanged"
            exit 0
          fi

          git commit -m "data: update intraday market snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
