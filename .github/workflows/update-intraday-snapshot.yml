name: Update Intraday Market Snapshot

# Staged replacement, same Cloudflare dispatch target; SHADOW ONLY until approved.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [automation/external-trigger-intraday.txt]
permissions:
  contents: write
concurrency:
  group: update-intraday-market-snapshot
  cancel-in-progress: false
jobs:
  focus_shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install existing exchange calendar dependency
        run: python -m pip install -r requirements.txt
      - name: Test fault isolation and slot gate
        run: python3 -m unittest discover -s tests -p test_intraday_focus_trial.py -v
      - name: Collect current focus snapshot
        env:
          FOCUS_MODE: SHADOW
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          FOCUS_HOLDINGS_TABLE_ID: tbl6EE2lzmexvkARz
        run: |
          rm -f focus_trial_public.json
          python3 scripts/intraday_focus_trial.py
      - name: Publish only the current shadow result and verify GitHub readback
        shell: bash
        run: |
          if [ ! -s focus_trial_public.json ]; then
            echo 'No approved trading slot, no publication'
            exit 0
          fi
          cp focus_trial_public.json research/intraday_focus_snapshot.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/intraday_focus_snapshot.json
          git commit -m "data: publish focus shadow $GITHUB_RUN_ID"
          git pull --rebase origin main
          git push origin HEAD:main
          git fetch origin main
          git show FETCH_HEAD:research/intraday_focus_snapshot.json | cmp - focus_trial_public.json
