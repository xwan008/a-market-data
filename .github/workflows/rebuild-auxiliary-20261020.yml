name: One-time auxiliary sector rebuild 2026-10-20

on:
  push:
    paths:
      - ".github/workflows/rebuild-auxiliary-20261020.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-time-auxiliary-rebuild-20261020
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen 2026-10-20 market inputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          latest=json.loads(Path("data/latest.json").read_text())
          low_risk=json.loads(Path("data/low_risk/index.json").read_text())
          assert latest["trade_date"]=="2026-10-20"
          assert latest["market_status"]=="closed"
          assert low_risk["trade_date"]=="2026-10-20"
          assert len(latest["stocks"])>=3000
          print("FROZEN_MARKET_INPUTS_OK",latest["trade_date"])
          PY
      - name: Recompute only archived auxiliary signals
        run: |
          python scripts/build_sector_discovery.py
          python scripts/build_theme_evidence.py
      - name: Verify crosscheck list and source dates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          load=lambda n:json.loads(Path(n).read_text())
          sector=load("data/research/sector_discovery_snapshot.json")
          audit=load("data/research/sector_discovery_audit.json")
          themes=load("data/research/theme_evidence_snapshot.json")
          assert sector["trade_date"]==audit["trade_date"]==themes["trade_date"]=="2026-10-20"
          assert themes["point_in_time_eligible"] is True
          assert themes["status"]=="COMPLETE"
          leads=themes["crosscheck_shortlist"]
          assert 0<=len(leads)<=3
          assert len({x["source_id"] for x in leads})==len(leads)
          assert [x["rank"] for x in leads]==list(range(1,len(leads)+1))
          print("CROSSCHECK_SHORTLIST_OK",json.dumps(leads,ensure_ascii=False))
          PY
      - name: Commit regenerated auxiliary JSON only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/sector_discovery_snapshot.json
          git add data/research/sector_discovery_audit.json
          git add data/research/theme_evidence_snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m "data: regenerate 2026-10-20 auxiliary crosscheck snapshot"
            git push origin HEAD:main
          else
            echo "No auxiliary changes to commit"
          fi
