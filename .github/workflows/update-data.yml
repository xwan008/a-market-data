name: Update Market Data

on:
  workflow_dispatch:
    inputs:
      skip_if_fresh:
        description: "Cloudflare dispatch: skip if today's formal data is already valid"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - ".github/external-trigger.txt"

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  precheck:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.freshness.outputs.should_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Decide whether fallback needs to run
        id: freshness
        shell: bash
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
          SKIP_IF_FRESH: ${{ inputs.skip_if_fresh }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          event = os.environ.get("TRIGGER_EVENT", "")
          schedule = os.environ.get("TRIGGER_SCHEDULE", "")
          is_fallback = (
              (event == "schedule" and schedule == "37 8 * * 1-5")
              or (event == "workflow_dispatch" and os.environ.get("SKIP_IF_FRESH", "").lower() == "true")
          )
          should_run = True
          reason = "primary_or_manual_run"

          if is_fallback:
              today = datetime.now(ZoneInfo("Asia/Shanghai")).date().isoformat()
              try:
                  latest = json.loads(Path("data/latest.json").read_text(encoding="utf-8"))
              except Exception:
                  latest = {}
              try:
                  low_risk = json.loads(Path("data/low_risk/index.json").read_text(encoding="utf-8"))
              except Exception:
                  low_risk = {}
              latest_trade_date = str(latest.get("trade_date") or "")
              latest_market_status = str(latest.get("market_status") or "")
              low_risk_trade_date = str(low_risk.get("trade_date") or "")
              low_risk_validation = low_risk.get("validation") or {}
              low_risk_valid = bool(
                  low_risk.get("runtime_format") == "low_risk_industry_working_set_index"
                  and low_risk_validation.get("status") == "passed"
                  and low_risk.get("materialized_layout") == "chunked_manifest_v1"
                  and low_risk_validation.get("chunk_manifest_complete") is True
                  and low_risk_validation.get("chunk_company_coverage_exact") is True
                  and low_risk_validation.get("chunk_size_within_limit") is True
              )
              derived_ready = False
              if latest_trade_date == today and low_risk_trade_date == today:
                  try:
                      from scripts.price_inputs import load_momentum_shards
                      coverage = load_momentum_shards(today)
                      sectors = json.loads(Path("data/research/sector_discovery_snapshot.json").read_text(encoding="utf-8"))
                      audit = json.loads(Path("data/research/sector_discovery_audit.json").read_text(encoding="utf-8"))
                      themes = json.loads(Path("data/research/theme_evidence_snapshot.json").read_text(encoding="utf-8"))
                      derived_ready = (
                          coverage["momentum_total"] >= 3000
                          and sectors.get("trade_date") == today
                          and audit.get("trade_date") == today
                          and themes.get("trade_date") == today
                          and themes.get("status") == "COMPLETE"
                          and themes.get("point_in_time_eligible") is True
                      )
                  except (OSError, ValueError, KeyError) as exc:
                      print(f"derived_data_not_ready:{exc}")
              already_fresh = (
                  latest_trade_date == today
                  and latest_market_status == "closed"
                  and low_risk_trade_date == today
                  and low_risk_valid
                  and derived_ready
              )
              should_run = not already_fresh
              reason = "fallback_already_fresh" if already_fresh else "fallback_refresh_required"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"should_run={'true' if should_run else 'false'}\n")
          print(f"decision={reason}; should_run={should_run}")
          PY

  update:
    needs: precheck
    if: needs.precheck.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch daily quotes and valuation
        run: python scripts/fetch_daily_market.py

      - name: Validate completed market session
        id: gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          latest = json.loads(Path("data/latest.json").read_text(encoding="utf-8"))
          stocks = latest.get("stocks") or {}
          total = len(stocks)
          status = str(latest.get("market_status") or "")
          source_status = latest.get("source_status") or {}
          source_ok = [name for name in ("sina", "tencent") if source_status.get(name) == "ok"]
          validation = latest.get("validation_stats") or {}
          usable = int(validation.get("high") or 0) + int(validation.get("medium") or 0)
          invalid = int(validation.get("invalid") or 0)
          quote_coverage = usable / total if total else 0
          invalid_ratio = invalid / total if total else 1
          fundamental = latest.get("fundamental_stats") or {}
          valuation_coverage = int(fundamental.get("valuation_usable") or 0) / total if total else 0
          financial_coverage = int(fundamental.get("financial_usable") or 0) / total if total else 0
          errors = fundamental.get("errors") or []
          fatal_errors = [error for error in errors if not str(error).startswith("eastmoney_valuation:")]
          persist = bool(
              status == "closed"
              and total >= 3000
              and source_ok
              and quote_coverage >= 0.99
              and invalid_ratio <= 0.01
              and valuation_coverage >= 0.95
              and financial_coverage >= 0.95
              and not fatal_errors
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"persist={'true' if persist else 'false'}\n")
          print(json.dumps({
              "trade_date": latest.get("trade_date"),
              "market_status": status,
              "stocks": total,
              "quote_coverage": round(quote_coverage, 4),
              "valuation_coverage": round(valuation_coverage, 4),
              "financial_coverage": round(financial_coverage, 4),
              "persist": persist,
          }, ensure_ascii=False))
          PY

      - name: Align prior K-line history for corporate actions
        if: steps.gate.outputs.persist == 'true'
        run: python scripts/adjust_corporate_actions.py

      - name: Append completed session to 180-day rolling K-line history
        if: steps.gate.outputs.persist == 'true'
        run: python scripts/history_store.py

      - name: Rebuild trend and price structure summary
        if: steps.gate.outputs.persist == 'true'
        run: python scripts/build_history.py

      - name: Build daily market environment state
        if: steps.gate.outputs.persist == 'true'
        run: python scripts/build_market_state.py

      - name: Rebuild quote shards
        if: steps.gate.outputs.persist == 'true'
        run: python scripts/build_bridge.py

      - name: Verify same-day momentum is present in rebuilt shards
        if: steps.gate.outputs.persist == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.price_inputs import load_momentum_shards

          latest = json.loads(Path("data/latest.json").read_text(encoding="utf-8"))
          day = latest["trade_date"]
          snapshot = load_momentum_shards(day)
          assert snapshot["momentum_total"] >= 3000, "MOMENTUM_UNIVERSE_TOO_SMALL"
          assert snapshot["momentum_valid"] >= 0.90 * snapshot["momentum_total"], "MOMENTUM_COVERAGE_FAILED"
          print(f"MOMENTUM_SHARDS_VERIFIED day={day} valid={snapshot['momentum_valid']}/{snapshot['momentum_total']}")
          PY

      - name: Apply industry mapping
        if: steps.gate.outputs.persist == 'true'
        run: python scripts/enrich_shards_with_industry.py

      - name: Build frozen company screening working sets 
        if: steps.gate.outputs.persist == 'true'
        run: python scripts/build_low_risk_working_sets.py

      - name: Clear obsolete auxiliary files before same-day calculation
        if: steps.gate.outputs.persist == 'true'
        run: |
          rm -f data/research/sector_discovery_snapshot.json
          rm -f data/research/sector_discovery_audit.json
          rm -f data/research/theme_evidence_snapshot.json

      - name: Run industry-first sector discovery (shadow evidence only)
        if: steps.gate.outputs.persist == 'true'
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -p 'test_sector_discovery.py' -q
          python scripts/build_sector_discovery.py

      - name: Build compact mapped-theme evidence (auxiliary only)
        if: steps.gate.outputs.persist == 'true'
        continue-on-error: true
        run: |
          python scripts/build_theme_evidence.py

      - name: Verify optional auxiliary evidence and expose failures
        if: steps.gate.outputs.persist == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          day = json.loads(Path("data/latest.json").read_text(encoding="utf-8"))["trade_date"]
          root = Path("data/research")
          sector = root / "sector_discovery_snapshot.json"
          audit = root / "sector_discovery_audit.json"
          theme = root / "theme_evidence_snapshot.json"
          statuses = []

          def read(path):
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except (OSError, ValueError):
                  return None

          s, a = read(sector), read(audit)
          sector_ok = bool(
              isinstance(s, dict) and isinstance(a, dict)
              and s.get("schema_version") == 1 and s.get("result_kind") == "sector_discovery_snapshot"
              and s.get("trade_date") == day and s.get("no_trade_signal") is True
              and s.get("status") in ("COMPLETE", "INDUSTRY_ONLY_PARTIAL")
              and a.get("schema_version") == 1 and a.get("trade_date") == day
          )
          if not sector_ok:
              sector.unlink(missing_ok=True)
              audit.unlink(missing_ok=True)
              statuses.append(("sector_discovery", "UNAVAILABLE"))
          else:
              statuses.append(("sector_discovery", s["status"]))

          t = read(theme)
          theme_ok = bool(
              isinstance(t, dict) and t.get("schema_version") == 1
              and t.get("result_kind") == "a_share_theme_evidence_snapshot"
              and t.get("trade_date") == day and t.get("status") == "COMPLETE"
              and t.get("point_in_time_eligible") is True
              and t.get("no_trade_signal") is True and t.get("auxiliary_only") is True
              and t.get("catalog_as_of_date", "9999") <= day
          )
          if not theme_ok:
              theme.unlink(missing_ok=True)
              statuses.append(("theme_evidence", "UNAVAILABLE"))
          else:
              statuses.append(("theme_evidence", "COMPLETE"))

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as fh:
              fh.write(f"### Python auxiliary evidence for {day}\n\n")
              for name, status in statuses:
                  fh.write(f"- {name}: **{status}**\n")
                  print(f"AUXILIARY_STATUS {name}={status} day={day}")
                  if status == "UNAVAILABLE":
                      print(f"::warning title=Python auxiliary evidence unavailable::{name} missing, stale, or invalid for {day}; primary market data is still persisted, do not claim Python verified the trend.")
          PY

      - name: Commit updated daily data
        if: steps.gate.outputs.persist == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage first, then decide whether there is anything to persist.
          # Force-add low_risk so formatting-only/materialization changes are never skipped.
          git add -A data
          git add -f -A data/low_risk

          echo "staged daily data diff:"
          git diff --cached --stat -- data || true

          if git diff --cached --quiet -- data; then
            echo "daily market data unchanged after staging"
          else
            git commit -m "data: update daily market dataset"
            git push origin HEAD:main
          fi

          # Read back the pushed commit and the actual small auxiliary artifacts.
          # Optional evidence may be absent, but never claim successful Python verification then.
          git fetch origin main --quiet
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          latest = json.loads(Path("data/latest.json").read_text(encoding="utf-8"))
          day = latest["trade_date"]
          shards = sorted(Path("data/shards").glob("*.json"))
          assert shards, "MOMENTUM_SHARDS_MISSING"
          paths = [
              Path("data/latest.json"),
              Path("data/low_risk/index.json"),
              shards[0],
              shards[-1],
              Path("data/research/sector_discovery_snapshot.json"),
              Path("data/research/sector_discovery_audit.json"),
              Path("data/research/theme_evidence_snapshot.json"),
          ]
          for path in paths:
              show = subprocess.run(
                  ["git", "show", f"origin/main:{path.as_posix()}"],
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=False
              )
              if path.exists():
                  assert show.returncode == 0 and show.stdout == path.read_bytes(), (
                      "READBACK_CONTENT_MISMATCH", path.as_posix()
                  )
              else:
                  assert show.returncode != 0, ("READBACK_STALE_ARTIFACT", path.as_posix())
          for path in (shards[0], shards[-1]):
              data = json.loads(path.read_text(encoding="utf-8"))
              assert data.get("trade_date") == day
              assert any(
                  (stock.get("trend") or {}).get("momentum_evidence")
                  for stock in (data.get("stocks") or {}).values()
              ), ("READBACK_MOMENTUM_MISSING", path.as_posix())
          print("DAILY_DATA_AND_AUXILIARY_READBACK_OK", day)
          PY

      - name: Report skipped persistence
        if: steps.gate.outputs.persist != 'true'
        run: echo "Current market dataset did not pass the completed-session data gate; repository data was not changed."
