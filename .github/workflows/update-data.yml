name: Update V2 Snapshot

on:
  workflow_dispatch:
  schedule:
    # 16:20 Asia/Shanghai, Monday-Friday.
    # GitHub cron uses UTC and may start a few minutes late.
    - cron: "20 8 * * 1-5"

permissions:
  contents: write

concurrency:
  group: update-v2-snapshot
  cancel-in-progress: false

jobs:
  build-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout V2 repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout shared upstream data
        uses: actions/checkout@v4
        with:
          repository: xwan008/a-share-market-data
          ref: main
          path: upstream
          fetch-depth: 1
          sparse-checkout: |
            data/shards
            data/research/industry_state.json
          sparse-checkout-cone-mode: false

      - name: Build snapshot
        run: |
          python scripts/build_snapshot.py \
            --source upstream \
            --output data/snapshot.json

      - name: Validate snapshot
        run: python scripts/validate_snapshot.py data/snapshot.json

      - name: Commit snapshot when changed
        shell: bash
        run: |
          if git diff --quiet -- data/snapshot.json && git ls-files --error-unmatch data/snapshot.json >/dev/null 2>&1; then
            echo "snapshot unchanged"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json
          git commit -m "data: update V2 snapshot"
          git push
