name: Trend Registry Regression

on:
  pull_request:
    paths:
      - "scripts/trend_registry.py"
      - "scripts/validate_trend_state_migrations.py"
      - "scripts/validate_trend_publication_pair.py"
      - "tests/test_trend_registry.py"
      - "skill/TREND_REGISTRY_PROTOCOL.md"
      - ".github/workflows/trend-regression.yml"
  push:
    branches: [main]
    paths:
      - "scripts/trend_registry.py"
      - "scripts/validate_trend_state_migrations.py"
      - "scripts/validate_trend_publication_pair.py"
      - "tests/test_trend_registry.py"
      - "skill/TREND_REGISTRY_PROTOCOL.md"
      - ".github/workflows/trend-regression.yml"

permissions:
  contents: read

jobs:
  trend-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Python syntax
        run: python -m compileall -q scripts/trend_registry.py scripts/validate_trend_state_migrations.py scripts/validate_trend_publication_pair.py tests/test_trend_registry.py
      - name: Run trend regression tests
        run: python -m unittest discover -s tests -p "test_trend_registry.py" -v
