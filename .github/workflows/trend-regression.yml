name: Trend Registry Regression

on:
  pull_request:
    paths:
      - "scripts/trend_registry.py"
      - "scripts/industry_lifecycle.py"
      - "dashboard/src/App.jsx"
      - "dashboard/src/model.js"
      - "dashboard/tests/model.test.js"
      - "tests/test_industry_lifecycle.py"
      - "tests/test_sw3_forward_baseline.py"
      - "tests/test_sw3_real_close_replay.py"
      - "tests/test_sw3_same_day_cutover.py"
      - "tests/test_sw3_post_cutover_continuity.py"
      - "scripts/sw3_same_day_cutover.py"
      - "tests/test_trend_publication_pair.py"
      - "tests/test_sw3_archive_replay.py"
      - "scripts/validate_trend_state_migrations.py"
      - "scripts/validate_trend_publication_pair.py"
      - "tests/test_trend_registry.py"
      - "skill/TREND_REGISTRY_PROTOCOL.md"
      - ".github/workflows/trend-regression.yml"
  push:
    branches: [main]
    paths:
      - "scripts/trend_registry.py"
      - "scripts/validate_trend_state_migrations.py"
      - "scripts/validate_trend_publication_pair.py"
      - "tests/test_trend_registry.py"
      - "skill/TREND_REGISTRY_PROTOCOL.md"
      - ".github/workflows/trend-regression.yml"

permissions:
  contents: read

jobs:
  trend-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Python syntax
        run: python -m compileall -q scripts/trend_registry.py scripts/industry_lifecycle.py scripts/validate_trend_state_migrations.py scripts/validate_trend_publication_pair.py tests/test_trend_registry.py tests/test_industry_lifecycle.py tests/test_trend_publication_pair.py
      - name: Run trend regression tests
        run: |
          python -m unittest discover -s tests -p "test_trend_registry.py" -v
          python -m unittest discover -s tests -p "test_industry_lifecycle.py" -v
          python -m unittest discover -s tests -p "test_sw3_forward_baseline.py" -v
          python -m unittest discover -s tests -p "test_sw3_real_close_replay.py" -v
          python -m unittest discover -s tests -p "test_sw3_same_day_cutover.py" -v
          python -m unittest discover -s tests -p "test_sw3_post_cutover_continuity.py" -v
          python -m unittest discover -s tests -p "test_trend_publication_pair.py" -v
          python -m unittest discover -s tests -p "test_sw3_archive_replay.py" -v
          python -m unittest discover -s tests -p "test_theme_handoff_routes.py" -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test trend board presentation
        run: npm --prefix dashboard test
