name: Validate entry-first prescreen on immutable Nov 5 market inputs
on:
  pull_request:
    paths:
      - 'scripts/trend_buy_prescreen_core.py'
      - 'scripts/prepare_trend_buy_candidates.py'
      - 'tests/test_trend_buy_admission.py'
      - 'skill/TREND_BUY_CANONICAL.md'
      - '.github/workflows/validate-entry-first-frozen.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/trend_buy_prescreen_core.py'
      - 'scripts/prepare_trend_buy_candidates.py'
      - 'tests/test_trend_buy_admission.py'
      - 'scripts/trend_buy_handoff.py'
      - '.github/workflows/validate-entry-first-frozen.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-nov5:
    name: Entry-first frozen replay regression (tests only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: 2766e8a328e4df0ec5a11edf591d13dfd85c1b97
          path: frozen
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inject proposed selection code into the immutable market fixture
        run: |
          cp candidate/scripts/trend_buy_prescreen_core.py frozen/scripts/trend_buy_prescreen_core.py
          cp candidate/scripts/prepare_trend_buy_candidates.py frozen/scripts/prepare_trend_buy_candidates.py
          cp candidate/tests/test_trend_buy_admission.py frozen/tests/test_trend_buy_admission.py
      - name: Run historical entry-priority, fallback and admission regressions
        working-directory: frozen
        run: |
          python -m unittest discover -s tests -p 'test_trend_buy_admission.py' -v
          python - <<'PY'
          import json,sys
          sys.path.insert(0,'scripts')
          from prepare_trend_buy_candidates import prepare
          x=prepare()
          assert x['trade_date']=='2026-11-05'
          assert x['selection_policy']=='ENTRY_FIRST_NO_QUOTAS'
          assert all(g['entry_selected_count']+g['watch_fallback_count']==len(g['selected_codes']) for g in x['industries'])
          print('ENTRY_FIRST_FROZEN_NOV05_REGRESSION',json.dumps({
            'date':x['trade_date'],
            'industry_count':x['industry_count'],
            'groups':x['industries']
          },ensure_ascii=False))
          PY
  archived-handoff-replay:
    name: Read-only archived handoff replay across policy boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reproject immutable real archive pairs without publishing
        run: |
          python - <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import trend_buy_handoff as h
          root=Path('validation/archive')
          for day in ('2026-11-24','2026-11-25'):
              folder=root/day
              formal_path=folder/'trend_buy_formal_result.json'
              handoff_path=folder/'trend_buy_handoff.json'
              raw=formal_path.read_bytes()
              handoff_raw=handoff_path.read_bytes()
              formal=json.loads(raw)
              saved=json.loads(handoff_raw)
              sha=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              assert saved['source_formal_blob_sha']==sha,day
              if formal.get('selection_policy')==h.TOP1_POLICY:
                  projected=h.project(formal,sha)
                  assert len(formal['python_top5_by_industry'])>0
              else:
                  projected=h.replay_historical_projection(formal,sha)
                  try:
                      h.project(formal,sha)
                  except ValueError as exc:
                      assert 'LEGACY_TOP5_FORMAL_DISABLED' in str(exc)
                  else:
                      raise AssertionError('legacy production path remained open')
              assert projected==saved,day
              assert formal_path.read_bytes()==raw and handoff_path.read_bytes()==handoff_raw
              print('ARCHIVE_REPLAY_EXACT_MATCH',day,'handoff_count',len(saved['items']))
          PY
