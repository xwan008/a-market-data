name: Manual official trend-buy baseline from completed Friday

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-trend-buy-baseline.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trend-buy-formal-publication
  cancel-in-progress: false

jobs:
  publish-completed-day:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assert only date-scoped manual replay is authorized
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('research/trend_buy_evidence_2026-10-09.json').read_text())
          h=json.loads(Path('research/trend_handoff.json').read_text())
          q=json.loads(Path('data/latest.json').read_text())
          assert d['as_of_date']==h['trade_date']==q['trade_date']=='2026-10-09'
          assert len(d['reviews'])==42
          # Never take a live/unfinished Saturday bar.
          print('MANUAL_ASOF',d['as_of_date'],len(d['reviews']))
          PY
      - name: Recompute and freeze all 8 routed sectors and 42 company reviews
        run: |
          python scripts/build_trend_buy_manual_research.py \
            --evidence research/trend_buy_evidence_2026-10-09.json \
            --output /tmp/trend_buy_formal_research_2026-10-09.json
      - name: Rebuild entire completed-session technical structure
        run: |
          python scripts/build_full_market_price_structure.py
      - name: Run production trend-buy engine only after fresh-run gates
        run: |
          python scripts/trend_buy_engine.py \
            --research /tmp/trend_buy_formal_research_2026-10-09.json \
            --structure data/research/full_market_price_structure.json \
            --output /tmp/trend_buy_formal_result_2026-10-09.json
      - name: Verify formal eligibility, historic asof, and add upstream audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          f=Path('/tmp/trend_buy_formal_result_2026-10-09.json')
          r=json.loads(f.read_text())
          a=json.loads(Path('/tmp/trend_buy_formal_research_2026-10-09.json').read_text())
          assert r['production_eligible'] is True and r['mode']=='FORMAL'
          assert r['status']=='COMPLETE' and r['trade_date']=='2026-10-09'
          assert r['coverage']['selected']==r['coverage']['judged']==42
          assert sum(r['summary'].values())==42
          assert a['screen_audit']['universe']==78
          assert len(a['screen_audit']['hard_filtered'])==4
          assert a['screen_audit']['hard_eligible']==74
          assert len(a['screen_audit']['pre_screen_selected'])==42
          assert len(a['screen_audit']['pre_screened_out'])==32
          assert r['structure_trade_date']=='2026-10-09'
          assert all(x['status']!='READY' or x['entry_zone'] for x in r['ready'])
          assert all(x['status']!='WAIT' or x['wait_reason'] for x in r['wait'])
          assert all(x['data_date']=='2026-10-09' for x in r['ready']+r['wait']+r['uncertain']+r['drop'])
          assert all(x['setup_type']=='PULLBACK' for x in r['wait'] if x['wait_reason']=='WAIT_PULLBACK'), 'WAIT_PULLBACK_must_use_actual_pullback_zone'
          assert not any('reasonable_buy_range' in x or 'low_risk_buy_range' in x for x in r['ready']+r['wait'])
          r['universe_audit']=a['screen_audit']
          r['manual_execution_asof']='2026-10-09 completed official session; executed 2026-10-10 (Saturday)'
          r['basis_is_not_oct10_price']=True
          f.write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n')
          print('FORMAL_SUMMARY',json.dumps(r['summary'],ensure_ascii=False))
          print('FORMAL_READY',json.dumps([
            {'code':x['code'],'name':x['company_name'],'entry_zone':x['entry_zone'],
             'invalidation_price':x['invalidation_price'],'setup_type':x['setup_type']}
            for x in r['ready']],ensure_ascii=False))
          PY
      - name: Publish formal result and read it back before preparing handoff
        run: |
          set -euo pipefail
          cp /tmp/trend_buy_formal_result_2026-10-09.json research/trend_buy_formal_result.json
          git config user.name "trend-buy-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/trend_buy_formal_result.json
          git commit -m "data: first complete 2026-10-09 trend-buy formal baseline"
          git push origin HEAD:main
          git fetch origin main
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          local=Path('research/trend_buy_formal_result.json').read_bytes()
          remote=subprocess.check_output(['git','show','origin/main:research/trend_buy_formal_result.json'])
          assert remote==local,'GITHUB_READBACK_MISMATCH_FORMAL'
          sha=subprocess.check_output(['git','hash-object','research/trend_buy_formal_result.json'],text=True).strip()
          assert len(sha)==40
          data=json.loads(remote)
          assert data['run_id']=='trend-buy-manual-20261010-asof-20261009' and data['production_eligible']
          Path('/tmp/trend_buy_formal_blob_sha.txt').write_text(sha)
          print('FORMAL_READBACK_PASSED',sha)
          PY
      - name: Project only formally published READY and WAIT into single V2 handoff
        run: |
          set -euo pipefail
          python scripts/trend_buy_handoff.py \
            --result research/trend_buy_formal_result.json \
            --result-blob-sha "$(cat /tmp/trend_buy_formal_blob_sha.txt)" \
            --output research/trend_buy_handoff.json
          python - <<'PY'
          import sys,json
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from trend_buy_handoff import validate_items
          r=json.loads(Path('research/trend_buy_formal_result.json').read_text())
          h=json.loads(Path('research/trend_buy_handoff.json').read_text())
          rows=validate_items(h)
          assert h['shadow'] is False
          assert h['source_run_id']==r['run_id']
          assert len(rows)==len(r['ready'])+len(r['wait'])
          assert h['trade_date']==r['trade_date']
          print('HANDOFF_READY_WAIT_COUNTS',len(r['ready']),len(r['wait']))
          PY
      - name: Publish V2 handoff and independently read back
        run: |
          set -euo pipefail
          git add research/trend_buy_handoff.json
          git commit -m "data: publish first V2 trend-buy handoff for next trading session"
          git push origin HEAD:main
          git fetch origin main
          python - <<'PY'
          import subprocess,json
          from pathlib import Path
          local=Path('research/trend_buy_handoff.json').read_bytes()
          remote=subprocess.check_output(['git','show','origin/main:research/trend_buy_handoff.json'])
          assert remote==local,'GITHUB_READBACK_MISMATCH_HANDOFF'
          h=json.loads(remote)
          f=json.loads(subprocess.check_output(['git','show','origin/main:research/trend_buy_formal_result.json']))
          assert h['source_run_id']==f['run_id']
          assert h['source_formal_blob_sha']==subprocess.check_output([
            'git','rev-parse','origin/main:research/trend_buy_formal_result.json'],text=True).strip()
          assert h['status']=='COMPLETE' and h['shadow'] is False
          print('HANDOFF_READBACK_PASSED',len(h['items']),h['trade_date'])
          PY
