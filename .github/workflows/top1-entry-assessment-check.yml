name: TOP1 entry assessment checks
on:
  pull_request:
    paths:
      - 'scripts/trend_buy_entry_assessment.py'
      - 'scripts/research_model_top1.py'
      - 'tests/test_top1_entry_assessment.py'
      - 'tests/replay_top1_entry_assessment.py'
      - 'tests/fixtures/top1_entry_replay_20261125_27.json'
      - '.github/workflows/top1-entry-assessment-check.yml'
permissions:
  contents: read
jobs:
  entry-assessment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_top1_entry_assessment.py -v
      - run: python -m py_compile scripts/research_model_top1.py scripts/trend_buy_entry_assessment.py
      - name: Replay archived TOP1 decisions using same-date OHLCV
        run: PYTHONPATH=. python tests/replay_top1_entry_assessment.py
