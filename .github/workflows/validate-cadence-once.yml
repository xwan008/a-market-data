name: Validate V2 Cadence Once

on:
  push:
    paths:
      - '.github/workflows/validate-cadence-once.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Run daily lightweight chain
        shell: bash
        run: |
          python scripts/fetch_daily_market.py
          python scripts/adjust_corporate_actions.py
          python scripts/history_store.py
          python scripts/build_history.py
          python scripts/build_market_state.py
          python scripts/build_bridge.py
          python scripts/enrich_shards_with_industry.py
          python scripts/build_snapshot.py --source . --output data/snapshot.json
          python scripts/attach_market_state.py data/snapshot.json
          python scripts/normalize_snapshot_source.py data/snapshot.json
          python scripts/validate_snapshot.py data/snapshot.json

      - name: Validate daily refresh modes
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          latest = json.loads(Path('data/latest.json').read_text(encoding='utf-8'))
          market = json.loads(Path('data/market_state.json').read_text(encoding='utf-8'))
          assert latest.get('refresh_mode') == 'daily_quotes_and_valuation'
          assert (latest.get('fundamental_stats') or {}).get('financial_refresh_mode') == 'carried_forward_from_weekly_refresh'
          assert market.get('trade_date') == latest.get('trade_date')
          assert market.get('risk_level') in {'low', 'medium', 'high'}
          print({
              'trade_date': latest.get('trade_date'),
              'daily_mode': latest.get('refresh_mode'),
              'financial_mode': (latest.get('fundamental_stats') or {}).get('financial_refresh_mode'),
              'market_state': {k: market.get(k) for k in ('trend','breadth','liquidity','risk_level')},
          })
          PY

      - name: Preserve daily snapshot before weekly refresh
        run: cp data/latest.json /tmp/latest.daily.json

      - name: Run weekly financial and industry chain
        shell: bash
        run: |
          python scripts/fetch_market_resilient.py
          python scripts/restore_valuation_fallback.py --current data/latest.json --previous /tmp/latest.daily.json
          python scripts/build_bridge.py
          python scripts/enrich_shards_with_industry.py
          python scripts/build_industry_state.py
          python scripts/build_snapshot.py --source . --output data/snapshot.json
          python scripts/attach_market_state.py data/snapshot.json
          python scripts/normalize_snapshot_source.py data/snapshot.json
          python scripts/validate_snapshot.py data/snapshot.json

      - name: Validate weekly coverage
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          latest = json.loads(Path('data/latest.json').read_text(encoding='utf-8'))
          industry = json.loads(Path('data/research/industry_state.json').read_text(encoding='utf-8'))
          snapshot = json.loads(Path('data/snapshot.json').read_text(encoding='utf-8'))
          total = len(latest.get('stocks') or {})
          fs = latest.get('fundamental_stats') or {}
          assert total >= 3000
          assert int(fs.get('financial_usable') or 0) / total >= 0.95
          assert industry.get('status') == 'valid'
          assert len(industry.get('level3_profitability') or {}) >= 50
          assert snapshot.get('market_state', {}).get('trade_date') == snapshot.get('trade_date')
          print({
              'stocks': total,
              'financial_coverage': round(int(fs.get('financial_usable') or 0) / total, 4),
              'industries': len(industry.get('level3_profitability') or {}),
              'candidates': snapshot.get('counts', {}).get('candidates'),
              'market_risk': snapshot.get('market_state', {}).get('risk_level'),
          })
          PY

      - name: Commit validated data
        shell: bash
        run: |
          if ! git status --porcelain -- data | grep -q .; then
            echo 'validated with no data changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data
          git commit -m 'data: validate daily weekly V2 cadence'
          git pull --rebase origin main
          git push origin HEAD:main
