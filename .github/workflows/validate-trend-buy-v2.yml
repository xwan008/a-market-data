name: Validate A-share trend-buy canonical

on:
  push:
    paths:
      - 'scripts/trend_buy_engine.py'
      - 'scripts/trend_buy_handoff.py'
      - 'scripts/build_intraday_snapshot.py'
      - 'tests/test_trend_buy_handoff.py'
      - 'tests/test_trend_buy_snapshot_bridge.py'
      - 'tests/test_trend_buy_full_pipeline.py'
      - 'skill/INTRADAY_MONITOR_CANONICAL.md'
      - 'scripts/run_trend_buy_shadow_compare.py'
      - 'research/shadow/low_risk_comparison_2026-10-09.json'
      - 'scripts/build_full_market_price_structure.py'
      - 'tests/test_trend_buy_engine.py'
      - 'tests/test_trend_buy_entry_focus.py'
      - 'tests/test_trend_buy_dynamic_top5.py'
      - 'tests/test_trend_buy_prescreen.py'
      - 'scripts/build_trend_buy_manual_research.py'
      - 'skill/PRE_SCREEN_RESEARCH_SCOPE_OVERRIDE.md'
      - 'skill/TREND_BUY_CANONICAL.md'
      - '.github/workflows/validate-trend-buy-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-trend-buy:
    name: Sole trend-buy production contracts plus historic regression
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal snapshot bridge dependencies
        run: python -m pip install 'requests>=2.31,<3'
      - name: Test technical entry and no stale/future leakage
        run: |
          python -m unittest discover -s tests -p 'test_trend_buy_engine.py' -v
          python -m unittest discover -s tests -p 'test_trend_buy_entry_focus.py' -v
          python -m unittest discover -s tests -p 'test_trend_buy_dynamic_top5.py' -v
          python -m unittest discover -s tests -p 'test_trend_buy_prescreen.py' -v
          python -m unittest discover -s tests -p 'test_trend_buy_handoff.py' -v
          python -m unittest discover -s tests -p 'test_trend_buy_snapshot_bridge.py' -v
          python -m unittest discover -s tests -p 'test_trend_buy_full_pipeline.py' -v
      - name: Rebuild historical same-day OHLCV structures (no commit)
        run: python scripts/build_full_market_price_structure.py
      - name: Read-only all-eligible lightweight scan and dynamic prescreen Top5 research audit
        run: |
          python scripts/build_trend_buy_manual_research.py --evidence research/trend_buy_evidence_2026-10-09.json --output /tmp/dynamic_research.json
          python scripts/trend_buy_engine.py --research /tmp/dynamic_research.json --structure data/research/full_market_price_structure.json --output /tmp/dynamic_result.json
          python - <<'PY'
          import json
          from pathlib import Path
          research=json.loads(Path('/tmp/dynamic_research.json').read_text())
          r=json.loads(Path('/tmp/dynamic_result.json').read_text())
          audit=research['screen_audit']
          assert audit['hard_eligible']==len(audit['lightweight_scanned'])
          assert audit['hard_eligible']==len(audit['pre_screen_selected'])+len(audit['pre_screened_out'])
          assert audit['research_scope']=='dynamic_tertiary_industry_top5_after_lightweight_scan'
          assert r['coverage']['judged']==len(audit['pre_screen_selected'])
          assert all(0 <= v <= 6 for v in audit['research_slots_per_industry'].values())
          assert r['coverage']['judged'] <= len(audit['research_slots_per_industry'])*6
          assert audit['source_review_pending_count']==r['coverage']['judged']-audit['source_review_complete_count']
          assert r['coverage']['complete']
          assert sum(r['summary'].values())==r['coverage']['judged']
          assert len(r['top5_by_theme'])==3
          assert all(len(x['items'])<=5 for x in r['top5_by_theme'])
          if audit['source_review_pending_count']:
              assert research['mode']=='SHADOW'
              assert r['production_eligible'] is False
          assert all(x['trend_phase']!='COOLING' for g in r['top5_by_theme'] for x in g['items'])
          assert r['focus_watchlist'] and len(r['focus_watchlist'])==3
          print('DYNAMIC_RESEARCH_SUMMARY',json.dumps({
            'trade_date':r['trade_date'],'coverage':r['coverage'],
            'lightweight_scanned':audit['hard_eligible'],
            'research_slots_by_industry':audit['research_slots_per_industry'],
            'research_pending':audit['source_review_pending_count'],
            'top5':{x['trend_name']:[y['code'] for y in x['items']] for x in r['top5_by_theme']},
            'focus':[(x['trend_name'],x.get('code')) for x in r['focus_watchlist']]
          },ensure_ascii=False))
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('data/research/full_market_price_structure.json').read_text())
          examples={'002074':'COOLING','002709':'REPAIRING','603659':'REPAIRING'}
          print('PHASE_EXAMPLES',{code:j['companies'][code].get('trend_phase') for code in examples})
          assert all('phase_evidence' in j['companies'][code] for code in examples)
          PY
      - name: Run independent historical Oct 9 regression fixture
        run: |
          python scripts/run_trend_buy_shadow_compare.py --screen-comparison research/shadow/low_risk_comparison_2026-10-09.json --structure data/research/full_market_price_structure.json --output /tmp/trend-buy-shadow-2026-10-09.json
          python scripts/trend_buy_handoff.py --shadow --result /tmp/trend-buy-shadow-2026-10-09.json --result-blob-sha shadow-not-formal --output /tmp/trend-buy-shadow-handoff.json
      - name: Check dynamic thematic Top5 projection and handoff schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('/tmp/trend-buy-shadow-2026-10-09.json').read_text())
          handoff=json.loads(Path('/tmp/trend-buy-shadow-handoff.json').read_text())
          assert result['production_eligible'] is False
          assert result['coverage']['selected']==result['coverage']['judged']
          assert sum(result['summary'].values())==result['coverage']['judged']
          assert len(handoff['items'])==sum(len(x['items']) for x in result['top5_by_theme'])
          import sys
          sys.path.insert(0,'scripts')
          from trend_buy_handoff import ALLOWED_ITEM_FIELDS, validate_items
          assert len(validate_items(handoff))==len(handoff['items'])
          assert all(set(x).issubset(ALLOWED_ITEM_FIELDS) for x in handoff['items'])
          print('SHADOW_SUMMARY',json.dumps(result['summary'],ensure_ascii=False))
          print('THEME_TOP5',json.dumps(result['top5_by_theme'],ensure_ascii=False)[:1200])
          PY
      - name: Archive historical regression output
        uses: actions/upload-artifact@v4
        with:
          name: trend-buy-regression-2026-10-09
          path: |
            /tmp/trend-buy-shadow-2026-10-09.json
            /tmp/trend-buy-shadow-handoff.json
          retention-days: 30
      - name: Syntax check trend-buy modules
        run: python -m py_compile scripts/build_full_market_price_structure.py scripts/build_trend_buy_manual_research.py scripts/trend_buy_engine.py scripts/trend_buy_handoff.py scripts/build_intraday_snapshot.py
